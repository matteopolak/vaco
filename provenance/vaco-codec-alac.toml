acquired = "2026-08-28"
where    = "https://github.com/macosforge/alac (codec/ subdirectory), Apple Inc., Apache License 2.0 -- licence confirmed directly against https://raw.githubusercontent.com/macosforge/alac/master/LICENSE before any of this source was read"

[[source]]
id       = "alac-ffmpeg-blackbox-cookie"
kind     = "blackbox"
title    = "ALACSpecificConfig bytes as ffmpeg 8.1's ALAC encoder actually writes them, measured from a real output file"
acquired = "2026-08-28"
where    = "Local measurement, not a document: `ffmpeg -f lavfi -i \"sine=frequency=440:duration=0.2:sample_rate=44100\" -ac 1 -c:a alac mono.m4a`, then a throwaway Python MP4 box walk (no container-parsing crate) to locate moov/trak/mdia/minf/stbl/stsd's `alac` sample-entry box and hex-dump its trailing 24-byte ALACSpecificConfig. Done because alac-magic-cookie states maxRun \"should be set to 255\"; ffmpeg's real encoder writes 0 instead -- a spec-vs-reality gap in the same spirit as planning/AGENT-CONSTRAINTS.md's \"a name in the reference is not a specification\". The measured bytes are pinned as cookie.rs's real_ffmpeg_mono_cookie regression test and reused in tests/oracle_alac_crate.rs to cross-check this crate's cookie parser against the alac crate's own StreamInfo::from_cookie on identical input."

# No [[table]] rows: this crate has no hand-transcribed constant table of 32
# or more elements (no VLC table, no quantiser table -- the provenance
# README's threshold for a row here). rice.rs's and predictor.rs's
# adaptation constants (QBSHIFT, MB0/PB0/KB0, MMULSHIFT/MDENSHIFT/MOFF,
# MAX_PREFIX) are transcribed from alac-agc-source's aglib.h, not this
# crate's own invention -- see this file's history and each constant's own
# doc comment for the corresponding reference name.
