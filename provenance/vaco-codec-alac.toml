# The above two are prose format-description documents Apple published
# alongside its reference decoder/encoder source under codec/ in the same
# repository. An earlier version of this file said vaco-codec-alac reads
# only these two files and never codec/'s C sources -- that was true only
# while this crate's predictor and entropy coder were a self-invented
# design that could not decode a real encoder's bitstream (see the
# now-superseded design note this replaced in frame_codec.rs and
# predictor.rs's own doc comments). It stopped being true once the owner
# confirmed (2026-08-28) that Apple's ALAC reference package
# (https://github.com/macosforge/alac) is licensed Apache License 2.0 --
# outside this project's D7/D15 clean-room rule, which is specifically
# about FFmpeg/libav-family GPL/LGPL code, not a blanket ban on every
# reference implementation. With that settled, this crate's rice.rs,
# predictor.rs and frame_codec.rs were rewritten as a from-scratch Rust
# translation of the algorithms in codec/ag_dec.c, codec/ag_enc.c,
# codec/aglib.h, codec/dp_dec.c, codec/matrix_dec.c,
# codec/ALACDecoder.cpp and codec/ALACAudioTypes.h -- see the
# `alac-agc-source` entry below and each module's own `Vaco-Spec-Ref`
# citations. The alac crate remains a dev-dependency oracle only, still
# probed as a black box for its observable input/output behaviour (see
# tests/oracle_alac_crate.rs) and never read as a coding reference --
# that boundary is unchanged; only the "never read codec/'s C sources"
# claim above it was wrong.

