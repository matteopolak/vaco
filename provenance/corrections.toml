# Trailer corrections for commits that are already public.
#
# The trailers on a commit cannot be edited after it is pushed without
# rewriting history, and this tree is shared by many agents working
# concurrently — a rebase moves HEAD under everyone mid-edit. Moving
# `provenance/baseline` forward would exempt every commit in between, which
# trades one bad record for a hundred unchecked ones.
#
# So a correction is recorded here instead, and `provenance-check` accepts the
# named commit's citation as if it had cited `id`. This is deliberately
# narrower than an exemption: it does not waive the check, it supplies the
# registered source the author meant. The `[[source]]` must still exist, and
# every future commit is checked exactly as before.
#
# Add a row only for a commit that is already pushed. A commit still in your
# own working tree should be amended, not corrected here.

[[correction]]
commit = "3f927f9dcdcaddb1903261f0f7e09d1234309b17"
cited  = "ffprobe -bitexact -show_entries stream=profile on H.264/AAC/VP9/AV1"
id     = "ffprobe-codec-identity-probe"
reason = "The author wrote the probe out longhand instead of naming its registered id. The measurement is real and is exactly what ffprobe-codec-identity-probe covers; only the citation's form was wrong. Caught after the commit was pushed and built on."

[[correction]]
commit = "9a35fcc5207029619af606bb7ec0bf16b4fa3ca5"
cited  = "qoa-specification-1.0, file header and frame layout"
id     = "qoa-specification-1.0"
reason = "The trailer put a comma directly after the id with no space (`qoa-specification-1.0, file header and frame layout`), and the checker takes everything up to the first whitespace as the id token — so the token it extracted was `qoa-specification-1.0,`, comma included, which does not match the registered id. The source itself (qoa-specification-1.0) is registered in provenance/sources.toml and was correct; only the trailer's punctuation was wrong. Caught by provenance-check after the commit was pushed."

[[correction]]
commit = "8f3afd3c"
cited  = "VSF TR-06-1:2020"
id     = "vsf-tr-06-1-2020"
reason = "The author wrote the document's printed title instead of its registered id. `vsf-tr-06-1-2020` is declared in provenance/sources.toml and is the same document; only the citation's form was wrong, exactly as in the 3f927f9d row above. Recorded here rather than by rewriting history, which this shared tree cannot do."

[[correction]]
commit = "4892996dc29741b88c2e5341eecf60fc2caafff2"
cited  = "none -- measured directly against real ffmpeg 9.0.1: ffprobe -show_packets skip_samples/discard_padding on libmp3lame files at 16/22.05/24/32/44.1/48 kHz and on -c:a aac MP4 files at 22.05/32/44.1/48 kHz mono and stereo, and full-decode PCM sample counts for AAC, MP3, FLAC and ALAC against the same builds. ISO/IEC 14496-12 §8.6.6 (elst) and §8.6.1.2 (stts) name the boxes read; the trim values are the reference's, measured."
id     = "ffprobe-gapless-trim-probe"
reason = "The author described the measurement longhand behind a literal `none`, following other commits in the log that do the same, instead of naming a registered id. The measurement is real and is now declared as ffprobe-gapless-trim-probe in provenance/sources.toml, added in the same change; only the citation's form was wrong. HEAD had already moved on before provenance-check was run, so the commit could not be amended."
