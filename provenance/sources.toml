title    = "\"The SRT Protocol\", draft-sharabayko-srt-01, IETF Internet-Draft (Haivision engineers: M. Sharabayko et al.). Common SRT packet header and data/control packet framing (Sec. 3, Fig. 2-4), the Handshake control packet's fixed CIF and its HSREQ/HSRSP extension body (Sec. 3.2.1, Fig. 5-6, Tables 4-6), the Key Material message shape (Sec. 3.2.2, Fig. 10-11), the Keep-Alive/ACK/NAK/Congestion-Warning/Shutdown/ACKACK/DropReq/PeerError control packet figures (Sec. 3.2.3-3.2.10), Control Type and Handshake Extension Type numeric tables (Table 1, Table 5), rejection reason codes (Table 7), and the caller-listener and rendezvous handshake message sequences including the cookie-contest role-resolution rule (Sec. 4.3.1-4.3.2) underlying vaco-protocol-srt::packet/handshake/km/session. Freely published; no clean-room blocker (D3/D7)."
acquired = "2026-08-28"
where    = "https://datatracker.ietf.org/doc/html/draft-sharabayko-srt-01 (IETF Datatracker's own free public rendering)"

[[source]]
id       = "vsf-tr-06-1-2020"
kind     = "spec"
title    = "Video Services Forum (VSF) Technical Recommendation TR-06-1:2020, \"Reliable Internet Stream Transport (RIST) Protocol Specification - Simple Profile\". RTP/RTCP baseline (Sec. 5.1-5.2: unicast/multicast port assignments, compound RTCP packet composition, SR/empty-RR/RR/SDES field-value constraints, the RTCP RTT Echo Request/Response APP message, Fig. 9-12), the NACK-based recovery protocol (Sec. 5.3: the two-section reorder/retransmission-reassembly receiver buffer and its Fig. 1, bitmask-based Generic NACK per RFC 4585, range-based APP-message NACK, retransmitted-packet SSRC-LSB tagging, Sec. 5.3.2-5.3.3), and Appendix A's own worked bitmask/range retransmission-request example underlying vaco-protocol-rist::rtcp/retransmit/buffer. Freely published, CC BY-ND 4.0; no clean-room blocker (D7/D15) -- the ND clause restricts redistributing the document itself, not independent conformant software. Carries a third-party patent (IPR) notice over most of Sec. 4/5 (Video-Flow Ltd, RAND-style license-to-any-implementer assurance) -- see planning/00-decisions.md D4's 2026-08-28 amendment."
acquired = "2026-08-28"
where    = "https://static.vsf.tv/download/technical_recommendations/VSF_TR-06-1_2020_06_25.pdf (VSF's own public download)"

