# The document register.
#
# Every source is declared **once**, here, and cited from anywhere: from a
# `[[table]]` row in a crate's file, or from a commit's `Vaco-Spec-Ref` trailer.
# ISO/IEC 14496-12 backs the MP4 demuxer, the MP4 muxer and the shared ISOBMFF
# crate; three copies of that acquisition record would be three chances for them
# to disagree, which is the failure mode this directory exists to prevent (D19).
#
# `kind`: spec | rfc | paper | blackbox | original.
# `blackbox` means measured from the reference binary rather than read from a
# document — permitted by D6, and a different kind of evidence, so it is
# labelled as one.

# ---------------------------------------------------------------- standards

