[[source]]
id       = "rfc-5761"
kind     = "rfc"
title    = "RFC 5761, Multiplexing RTP Data and Control Packets on a Single Port. Sec. 4's payload-type-range heuristic (RTCP packet types 192-223, so a value in that range on the first payload octet is RTCP, never RTP) used by vaco-protocol-rtp's RFC 3550/3551-agnostic mux/demux."
acquired = "2026-08-28"
where    = "https://www.rfc-editor.org/rfc/rfc5761"

[[source]]
id       = "rfc-3711"
kind     = "rfc"
title    = "RFC 3711, The Secure Real-time Transport Protocol (SRTP). Sec. 4.1.1's per-packet keystream IV construction (SSRC/ROC/sequence-number XORed into the session salt), Sec. 4.2's authentication tag (HMAC-SHA1 over the packet plus the ROC, truncated), and Sec. 4.3's key derivation function (AES-CTR keyed by the master key, over an index built from the master salt and a per-key-type label byte) underlying vaco-protocol-srtp. This RFC publishes no numeric test vectors of its own (checked directly, no appendix titled \"test vector\"), so evidence here is self-consistency plus draft-derived field layout, not RFC-vector-derived."
acquired = "2026-08-28"
where    = "https://www.rfc-editor.org/rfc/rfc3711"

[[source]]
id       = "rfc-4960"
kind     = "rfc"
title    = "RFC 4960, Stream Control Transmission Protocol (SCTP). Sec. 3.1's common packet header and CRC32c checksum (Appendix B, the Castagnoli polynomial, same as iSCSI), Sec. 3.3's chunk header and INIT/INIT-ACK/COOKIE-ECHO/COOKIE-ACK/DATA/SACK/HEARTBEAT/ABORT/SHUTDOWN chunk field layouts, and Sec. 5's four-way association-setup handshake, underlying vaco-protocol-sctp."
acquired = "2026-08-28"
where    = "https://www.rfc-editor.org/rfc/rfc4960"

