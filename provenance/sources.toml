[[source]]
id       = "ffmpeg-mp4-sample-duration-probe"
kind     = "blackbox"
title    = "ffmpeg/ffprobe 9.0.1, measured as black boxes, on how the last sample of an MP4 track gets a duration. (1) `ffmpeg -f lavfi -i testsrc=size=64x48:rate=30:duration=0.666 -c:v libx264 -pix_fmt yuv420p` writes `stts = [(20, 512)]` with `mdhd.timescale = 15360, duration = 10240` -- twenty equal deltas, no trailing `(1, 0)` run, and a media duration that includes the last sample. A single-frame run (`-frames:v 1`) likewise writes `stts = [(1, 512)]`, `mdhd.duration = 512`. So the reference muxer states a real duration for the final sample rather than zero. (2) In the read direction, on a file hand-built with `stts = [(19, 100), (1, 0)]` at timescale 30 (twenty 9-byte samples, one chunk), `ffprobe -count_packets -show_entries stream=nb_read_packets` reports 20, and `ffprobe -show_entries packet=dts,duration` reports the twentieth packet as `dts=1900,duration=100` -- the reference demuxer surfaces a zero-`stts`-delta video sample and substitutes the previous delta for its duration, rather than dropping it. Boxes read by walking the files directly; no ffmpeg source was consulted."
acquired = "2026-09-02"
where    = "the reference binary installed on the development machine"

[[source]]
id       = "ffmpeg-last-item-duration-probe"
kind     = "blackbox"
title    = "Cross-container probe of how ffmpeg/ffprobe 9.0.1 states the duration of the *last* item in a sequence, run while sweeping issue #658's seven muxers for the same defect class `91c15a2b` fixed in MP4 (a final item written with a literal zero or omitted duration instead of its real content span). `ffmpeg -f lavfi -i testsrc=size=64x48:rate=10:duration=2.05 -c:v libx264 -g 10 -force_key_frames expr:gte(t,n_forced*1) -f segment -segment_time 1 -segment_list list.m3u8 out%d.mp4`: the final segment (one trailing 0.1s frame) is listed as `#EXTINF:0.100000,`, matching the segment file's own `ffprobe -show_entries format=duration`, never `0.000000`. Repeated with `ffmpeg -f lavfi -i sine=frequency=1000:duration=2.5 -c:a pcm_s16le -f segment -segment_time 1 -segment_list list.m3u8 out%d.wav`: every listed `#EXTINF`, including the last (`0.479864`), equals that segment's own exact sample-derived duration, confirming the rule is \"real content span\", not \"time to the next cut\". Boxes and lists read directly; no ffmpeg source consulted."
acquired = "2026-09-03"
where    = "the reference binary installed on the development machine"

