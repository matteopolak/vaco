id       = "ffmpeg-mxf-mux-ber-width-probe"
kind     = "blackbox"
title    = "A fourth probing session against real ffmpeg 8.1 MXF output, driven by the coordinating dispatch's specific ask (was the Primer Pack's BER-length-width divergence general or Primer-Pack-specific, and what were the ~1536 unidentified D-10/OP-Atom header bytes): walked every KLV's own BER length prefix directly in two real fixtures (a single-track -f mxf file and a freshly generated two-track one) and found a per-KLV-family split -- the Partition Pack family, the Fill Item, the System Item, essence elements, the Index Table Segment, and every essence descriptor class (MPEGVideoDescriptor, AES3PCMDescriptor) use this project's already-known fixed-width form, while the Primer Pack, every other structural set (Preface, Identification, ContentStorage, both Packages, Track, Sequence, SourceClip, TimecodeComponent, MultipleDescriptor), and the Random Index Pack use minimal-width BER instead; decoded a real file's own class-0x23 structural set directly and cross-validated it as ST377-1's EssenceContainerData two independent ways (its InstanceUID matches ContentStorage's own previously-unnamed second batch property at tag 0x1902, and its LinkedPackageUID property at tag 0x2701 -- a 32-byte value under the SMPTE UMID designator root 06 0a 2b 34, distinct from every other property's 06 0e 2b 34 Universal Label root -- is byte-identical to the SourcePackage's own UMID used elsewhere in the same file); decoded a real Random Index Pack's own entries directly and found this project's own RIP-writing code had both a wrong entry count (missing the Body Partition Pack) and a wrong BodySID for the header's own entry; and, while re-measuring after fixing both named divergences, found the actual dominant remaining gap is neither of them -- a real file's Primer Pack registers a fixed ~100-tag dictionary regardless of which properties the specific file uses (measured: 100 entries, 1808 bytes, on a single-track file), and its Identification set carries real product/version metad