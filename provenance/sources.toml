title    = "ffmpeg 8.1's smoothstreaming muxer (no demuxer exists for this format, in ffmpeg or anywhere else measured), captured twice against real testsrc/sine input (mpeg2->h264/aac, 320x240): a 3-second run (one fragment per track: QualityLevels(60317)/{Fragments,FragmentInfo}(video=800000), QualityLevels(69000)/{Fragments,FragmentInfo}(audio=586667)) and a 12-second run (three fragments per track, at QualityLevels(59793)/*(video={800000,50800000,100800000}) and QualityLevels(69000)/*(audio={586667,50080000,100000000})), both under vaco-mux-smoothstreaming's own tests. Byte-level box-walking both trees established: the Manifest XML schema (SmoothStreamingMedia/StreamIndex/QualityLevel/c elements, exact attribute names and the c element's own d-only convention with no t/start-time attribute ever written); that FragmentInfo(TYPE=STARTTIME) is byte-for-byte the Fragments file's own moof box with no mdat (confirmed by exact size equality); the moof/traf internal structure (mfhd, tfhd with default_base_is_moof and default_sample_flags only, trun with measured flag sets 0x0f01 for video vs 0x0301 for audio, tr_flags fixed up post-hoc for the real mdat data_offset); the MS-proprietary tfxd uuid box (6d1d9b05-42d5-44e6-80e2-141daff757b2, version 1, 64-bit fragment_absolute_time+fragment_duration in the fixed 10,000,000-ticks/second HNS timescale); and the MS-proprietary tfrf uuid box (d4807ef2-ca39-4695-8e54-26cb9e46a79f, a look-ahead box naming subsequent fragments' absolute times/durations, present on all but the final fragment of a track and requiring a seek-back rewrite of already-written FragmentInfo/Fragments files once a later fragment becomes known) -- tfrf's own seek-back-rewrite behavior was measured but deliberately not reproduced, see planning/TECH-DEBT.md. CodecPrivateData's exact encoding (Annex-B SPS/PPS with 00000001 start codes for H.264; raw AudioSpecificConfig hex for AAC) was cross-checked against the fixtures' own avcC/AudioSpecificConfig source bytes."
acquired = "2026-08-28"
where    = "the reference binary installed on the development machine"

[[source]]
id       = "ffmpeg-hds-mux-probe"
kind     = "blackbox"
title    = "ffmpeg 8.1's hds muxer (no demuxer exists for this format, in ffmpeg or anywhere else measured), captured twice against real testsrc/sine input (h264/aac): a one-quality-level, 12-second run (out12.f4m: index.f4m, stream0.abst, stream0Seg1-Frag1/2, split 10s/2.069s at the 10s min_frag_duration default) and a two-quality-level, 6-second run (out_multi.f4m: index.f4m, stream0.abst/stream1.abst, stream0Seg1-Frag1/stream1Seg1-Frag1, from four mapped streams video0/audio0/video1/audio1 in that order). Byte-level box-walking and hex-dumping both trees established: that a quality level bundles video and audio into one interleaved stream rather than one file per elementary stream (contrast Smooth Streaming); that every file this format writes sits flat in the manifest's own directory (no per-quality subdirectory, unlike Smooth Streaming's QualityLevels(<bitrate>)/, confirmed with the two-quality-level tree); that each stream<N>Seg1-Frag<M> file is one bare mdat box (no moof at all) wrapping a sequence of classic FLV tags (TagType/DataSize/Timestamp/TimestampExtended/StreamID/payload/PreviousTagSize), audio and video interleaved, with both tracks' AVC/AAC sequence-header tags restated fresh at the start of every fragment (confirmed: fragment 2 of the two-fragment tree opens with a fresh avcC-derived video sequence header then a fresh AudioSpecificConfig-derived audio sequence header, both at the fragment's own start timestamp, before any real sample); the exact FLV VIDEODATA/AVCVIDEOPACKET and AUDIODATA/AACAUDIODATA tag byte layout (FrameType<<4|CodecID, AVCPacketType, 24-bit CompositionTime for video; a fixed 0xAF SoundFormat/Rate/Size/Type byte -- always indicating stereo regardless of the real, measured-mono input -- plus AACPacketType for audio); the abst/asrt/afrt bootstrap-box binary layout field-by-field (bootstrapinfoVersion, profile/live/update flags byte, a fixed 1000-tick (millisecond, not Smooth Streaming's 10,000,000-tick HNS) timescale, currentMediaTime, one asrt always naming segment 1, one afrt per quality level whose entries' firstFragment/firstFragmentTimestamp/fragmentDuration triples were confirmed to reproduce the measured 10s/2.069s fragment split exactly); and the index.f4m manifest's own XML schema plus its <media> element's base64-encoded onMetaData AMF0 ECMA-array blob (decoded independently, field by field: duration/filesize both 0 for streamed output, videodatarate/audiodatarate in bits_per_second/1024.0 -- a different unit from the manifest's own decimal-kbit/s bitrate attribute, reverse-derived exactly from the known -b:v/-b:a values -- and stereo hard-coded false)."
acquired = "2026-08-28"
where    = "the reference binary installed on the development machine"

[[source]]
id       = "draft-sharabayko-srt-01"
