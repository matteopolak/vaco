# The `framecrc`/`crc` finding: not CRC-32 at all, but Adler-32, and the
# per-packet variant seeded (a=0, b=0) rather than RFC 1950's (a=1, b=0).
# Established by refuting every catalogued CRC-32 variant against the bytes,
# solving the seed algebraically, then confirming from a different direction
# with `framehash -hash adler32`. See docs/core/vaco-hash.md.
