[[source]]
id       = "rfc-8018"
kind     = "rfc"
title    = "RFC 8018, PKCS #5: Password-Based Cryptography Specification Version 2.1. Sec. 5.2's PBKDF2 algorithm definition underlying vaco-crypto::pbkdf2_hmac_sha256. Checked directly and confirmed to contain no test vectors of its own (no appendix titled \"Test Vectors\"; full-text search for \"Test Vector\" and for \"6070\" both return zero matches) -- cited here only for the algorithm definition, not as a source of test data; see rfc-7914 for the vectors actually used."
acquired = "2026-08-28"
