id       = "locoi-hpl98-193"
kind     = "paper"
title    = "M. Weinberger, G. Seroussi, G. Sapiro, \"The LOCO-I Lossless Image Compression Algorithm: Principles and Standardization into JPEG-LS\", HP Labs technical report HPL-98-193, Nov 1998 (later published in IEEE Trans. Image Processing, 2000). The algorithm JPEG-LS (ITU-T T.87 / ISO/IEC 14495-1) standardizes; the paper documents the regular-mode model (MED predictor, context quantization, bias cancellation, Golomb coding) in full detail, and states the ISO/ITU text itself was too obscure to reproduce that from. vaco-codec-jpegls's run-mode adaptation table and run-interruption sample formulas are not given numerically here and were instead measured against ffmpeg -c:v jpegls's own decode (D17), documented in that crate's own module docs."
acquired = "2026-08-28"
where    = "http://shiftleft.com/mirrors/www.hpl.hp.com/techreports/98/HPL-98-193.pdf"

