id       = "vsf-tr-06-1-2020"
kind     = "spec"
title    = "Video Services Forum (VSF) Technical Recommendation TR-06-1:2020, \"Reliable Internet Stream Transport (RIST) Protocol Specification - Simple Profile\". RTP/RTCP baseline (Sec. 5.1-5.2: unicast/multicast port assignments, compound RTCP packet composition, SR/empty-RR/RR/SDES field-value constraints, the RTCP RTT Echo Request/Response APP message, Fig. 9-12), the NACK-based recovery protocol (Sec. 5.3: the two-section reorder/retransmission-reassembly receiver buffer and its Fig. 1, bitmask-based Generic NACK per RFC 4585, range-based APP-message NACK, retransmitted-packet SSRC-LSB tagging, Sec. 5.3.2-5.3.3), and Appendix A's own worked bitmask/range retransmission-request example underlying vaco-protocol-rist::rtcp/retransmit/buffer. Freely published, CC BY-ND 4.0; no clean-room blocker (D7/D15) -- the ND clause restricts redistributing the document itself, not independent conformant software. Carries a third-party patent (IPR) notice over most of Sec. 4/5 (Video-Flow Ltd, RAND-style license-to-any-implementer assurance) -- see planning/00-decisions.md D4's 2026-08-28 amendment."
acquired = "2026-08-28"
where    = "https://static.vsf.tv/download/technical_recommendations/VSF_TR-06-1_2020_06_25.pdf (VSF's own public download)"

[[source]]
id       = "vsf-tr-06-2-2022"
kind     = "spec"
title    = "Video Services Forum (VSF) Technical Recommendation TR-06-2:2022, \"Reliable Internet Stream Transport (RIST) Protocol Specification - Main Profile\". GRE tunnelling (Sec. 5), DTLS support (Sec. 6.1-6.3: session establishment, mandatory cipher suites, certificate configuration -- built in vaco-protocol-rist::dtls on top of vaco-protocol-dtls once that crate landed 2026-08-28; Sec. 6.2's per-suite disable requirement and Sec. 6.4's TLS-SRP remain gaps, filed separately), Pre-Shared Key encryption (Sec. 7.1-7.4: the GRE Key/Nonce field, AES-128/256-CTR keyed by a PBKDF2-HMAC-SHA256-derived key, the sequence-number-derived IV construction, Fig. 9-11) and PSK authentication (Sec. 7.5, pointing to the Normative Annex D EAP SHA256-SRP6a protocol -- filed separately as issue #657, not built as part of #559), and Annex B's own worked PBKDF2 key-derivation example underlying vaco-protocol-rist's Main Profile work and vaco-crypto::kdf. Freely published, CC BY-ND 4.0; no clean-room blocker (D7/D15). Carries the same class of third-party patent notice as TR-06-1 (Sec. 5 excl. 5.6.4, 6, 7)."
acquired = "2026-08-28"
where    = "https://static.vsf.tv/download/technical_recommendations/VSF_TR-06-2_2022-08-11.pdf (VSF's own public download)"

