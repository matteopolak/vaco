[[source]]
id       = "ffprobe-gif-frame-count-probe"
kind     = "blackbox"
title    = "Frame-count sweep of ffmpeg/ffprobe 9.0.1 on deliberately truncated GIFs, run to resolve a frame-count divergence between `vaco-codec-gif` and `ffprobe -count_frames`. A real ffmpeg-encoded 3-frame animation (`testsrc=size=16x12:rate=5:duration=0.6`) truncated by 1/5/10/20 trailing bytes (removing only the trailer, then increasing amounts of the last frame's LZW data) still reports `nb_read_frames=3` at every cut, logging `LZW decode failed` but keeping the frame; the same holds for a single-frame GIF truncated the same way (`nb_read_frames=1`). Truncating instead inside the still-unread Image Descriptor/LZW-init header (before at least the minimum-code-size byte and one sub-block-length byte are both present) drops the stream to no readable frames at all (`nb_read_frames` absent). GIF89a itself (gif89a-spec) specifies neither behaviour: Table Based Image Data (§22) and Data Sub-blocks (§15) assume a well-formed block sequence and say nothing about recovery from a truncated one. `vaco-codec-gif` previously discarded a frame outright whenever its LZW data errored, even after successfully parsing that frame's own header, undercounting versus this reference behaviour; the fix separates header parsing from pixel-data reads so a header-complete, pixel-incomplete frame is still counted, matching the reference's own boundary. Boxes and counts read/computed directly; no ffmpeg source consulted."
acquired = "2026-09-03"
where    = "the reference binary installed on the development machine"

