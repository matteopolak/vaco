# Not transcribed: the matrix is generated by evaluating the standard's own
# equations, and `hevc.rs` records the extraction and validation method. That
# distinction matters here more than anywhere else in the repository — the
# literal reading of equation 8-317 reproduces the well-known integer cores
# and still computes the wrong transform, which is how two independent
# "oracles" both passed on a wrong implementation (plan 13, and
# AGENT-CONSTRAINTS "An oracle you wrote shares your misreading").
[[table]]
name   = "TRANS_MATRIX_32"
file   = "crates/signal/vaco-codec-dsp-idct/src/hevc_matrix.rs"
source = "itu-t-h265-202108"
clause = "clause 8.6.4.2, equations (8-318)-(8-321)"
method = "derived"
