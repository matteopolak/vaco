[[source]]
id       = "ffv1-blackbox-coder-default"
kind     = "blackbox"
title    = "ffmpeg 8.1's ffv1 encoder help text: -coder default is rice (Golomb-Rice, coder_type 0), not the range coder"
acquired = "2026-08-27"
where    = "Local measurement, not a document: `ffmpeg -h encoder=ffv1`, which lists `-coder <int>` with default `0` (`rice`) among `range_def`/`range_tab`/`ac` aliases. Confirmed against a real encode's Configuration Record (see ffv1-blackbox-config-record below): a plain `ffmpeg ... -c:v ffv1 out.mkv` with no explicit `-coder` writes coder_type = 0."

[[source]]
id       = "ffv1-blackbox-multislice"
kind     = "blackbox"
title    = "A 64x64 ffmpeg ffv1 encode defaults to a 2x2 (4-slice) grid, well under RFC 9043 §5's 101376-pixel multi-slice-recommendation threshold"
acquired = "2026-08-27"
where    = "Local measurement, not a document: `ffmpeg -f lavfi -i \"testsrc=size=64x64:rate=5:duration=1\" -pix_fmt yuv420p -coder range_def -c:v ffv1 out.mkv`, then a hand-written Matroska EBML walk (no container-parsing crate) to pull the Configuration Record out of CodecPrivate and range-decode its Parameters(): num_h_slices = num_v_slices = 2. Repeated with `-threads 1` (no change) and against a second, larger 176x144 fixture (`ffmpeg -f lavfi -i \"testsrc=size=176x144:rate=5:duration=1\" -pix_fmt yuv420p -c:v ffv1 out.mkv`, also 2x2). This forced vaco-codec-ffv1's decoder to implement full multi-slice decode via SliceFooter.slice_size backward-chaining (RFC 9043 §4.9.1) rather than assuming a single slice, even though this crate's own encoder still only ever writes one."

[[source]]
id       = "ffv1-blackbox-crc-variant"
kind     = "blackbox"
title    = "RFC 9043 §4.9.3's \"standard IEEE CRC polynomial... without pre/post-inversion\" is the non-reflected (MSB-first) CRC-32, not the more familiar reflected zlib/gzip/PNG variant"
acquired = "2026-08-27"
where    = "Local measurement, not a document: the trailing 4 bytes of a real ffmpeg-encoded FFV1 Configuration Record (extracted from `ffmpeg -f lavfi -i \"testsrc=size=176x144:rate=5:duration=1\" -pix_fmt yuv420p -c:v ffv1 out.mkv`'s Matroska CodecPrivate) were run through both the reflected and non-reflected CRC-32(poly 0x04C11DB7, init 0, no final complement) algorithms as a whole-record check (RFC 9043's own \"equivalent to storing the CRC remainder... as parity\" self-check). Only the non-reflected variant reduces the whole record, parity included, to exactly 0; the reflected variant this crate's crc.rs originally implemented gave a nonzero, meaningless value on the same bytes. See crc.rs's own doc comment and its real_ffmpeg_configuration_record_crc_checks_out test, which pins this against tests/fixtures/yuv420_extradata.bin."

[[source]]
id       = "ffv1-blackbox-fixtures"
kind     = "blackbox"
title    = "Exact ffmpeg commands used to produce this crate's real-file cross-check fixtures under tests/fixtures/"
acquired = "2026-08-27"
where    = "Local measurement, not a document. Fixture 1 (yuv420_*, default coder): `ffmpeg -f lavfi -i \"testsrc=size=176x144:rate=5:duration=1\" -pix_fmt yuv420p -c:v ffv1 out.mkv`. Fixture 2 (yuv420_range_*, range coder): `ffmpeg -f lavfi -i \"testsrc=size=64x64:rate=5:duration=1\" -pix_fmt yuv420p -coder range_def -c:v ffv1 out.mkv`. Both were pulled apart by a hand-written Matroska EBML walk (Segment/Tracks/TrackEntry/CodecPrivate/Cluster/SimpleBlock — never ffmpeg's own demuxer or decoder) into the raw Configuration Record and per-frame coded bytes; ffmpeg's own raw-YUV decode of the same source (`ffmpeg -i out.mkv -f rawvideo -pix_fmt yuv420p ref.raw`) supplied the pixel-exact reference used by tests/roundtrip.rs's real-ffmpeg cross-checks."

[[source]]
id       = "ffv1-blackbox-rice160"
kind     = "blackbox"
title    = "ffmpeg 9.0.1 Golomb-Rice FFV1 fixture (160x120, three frames, only the first a keyframe) and the pixel reference it is checked against"
acquired = "2026-09-02"
where    = "Local measurement, not a document. `ffmpeg -f lavfi -i \"testsrc2=size=160x120:rate=25:duration=0.12\" -pix_fmt yuv420p -c:v ffv1 -coder rice out.mkv` (ffmpeg 9.0.1); pulled apart by the same hand-written Matroska EBML walk as ffv1-blackbox-fixtures into tests/fixtures/rice160_extradata.bin and rice160_frame{0,1,2}.bin. tests/fixtures/rice160.raw is ffmpeg's own decode of that file (`ffmpeg -i out.mkv -f rawvideo -pix_fmt yuv420p`), confirmed byte-identical to the unencoded testsrc2 output first, so the reference side is known sound. The stream's Parameters carry intra = 0 and ec = 1: only frame 0 is a keyframe, so frames 1-2 exercise Golomb VLC context state persisting across frames, which no single-frame fixture can."

[[source]]
id       = "ffv1-blackbox-closed-mode-length"
kind     = "blackbox"
title    = "A range-coded FFV1 region's decoder must finish exactly one byte past its coded length; ffmpeg rejects a slice that ends level with it"
acquired = "2026-09-02"
where    = "Local measurement, not a document: a from-RFC-9043 range decoder written outside this tree was run over every slice of frame 0 of `ffmpeg -c:v ffv1 -coder range_def` output and over its Configuration Record, reporting bytes consumed against each region's own coded length. Every region came out at length + 1 once the Sentinel symbol (state 129) had been read -- i.e. ffmpeg terminates in RFC 9043 Sec 3.8.1.1.1's Closed mode, the decoder taking the byte past the end as zero. This crate's encoder emitted the Open-mode length instead, and `ffmpeg -i` rejected 42 of 50 frames with \"bytestream end mismatching by 1\" (the 8 it accepted being the ones whose final get_rac happened not to need a refill). Pinned by rangecoder.rs's finish_produces_the_closed_mode_length_ffmpeg_requires test, which needs no ffmpeg binary."

[[source]]
id       = "ffv1-blackbox-rct-interleave"
kind     = "blackbox"
title    = "JPEG 2000 RCT Line interleave, and the one Golomb-Rice run_index all three interleaved planes share"
acquired = "2026-09-02"
where    = "Local measurement, not a document. `ffmpeg -f lavfi -i \"testsrc2=size=96x64:rate=25:duration=0.04\" -pix_fmt gbrp -c:v ffv1 [-coder rice | -coder range_def]` (ffmpeg 9.0.1), decoded by a from-RFC-9043 decoder written outside this tree and compared sample-by-sample against ffmpeg's own raw gbrp decode. RFC 9043 Sec 4.7 already specifies the row-then-Plane Line order for colorspace_type 1; what it does not specify is what becomes of Sec 3.8.2.2.1's \"run_index is reset to zero for each Plane and Slice\" once there is no per-plane boundary to reset at. Measured on frame 0 of the -coder rice file: one run_index shared by all three planes for the whole slice decodes every one of 57,600 samples correctly; one per plane leaves 57,165 wrong; one per quantization-table-set index (Y alone, Cb and Cr together, which is how the VLC context states are grouped) leaves 56,363. The shared model is therefore inference from measurement, not from the RFC. Fixtures: tests/fixtures/gbrp_{rice,range}_*."

[[source]]
id       = "ffv1-blackbox-custom-transition-table-scope"
kind     = "blackbox"
title    = "state_transition_delta shares Parameters' own state array, and the custom table it builds applies to Slices only, not to the rest of the Configuration Record"
acquired = "2026-09-02"
where    = "Local measurement, not a document: the 190-byte Configuration Record of `ffmpeg -f lavfi -i \"testsrc2=size=96x64:rate=25:duration=0.04\" -pix_fmt yuv420p -c:v ffv1 -coder range_tab out.mkv` (ffmpeg 9.0.1) was parsed four ways with a from-RFC range decoder. Giving the 255 state_transition_delta symbols their own fresh state array reads bits_per_raw_sample = 1, log2_v_chroma_subsample = 1, extra_plane = 1 and quant_table_set_count = 0 out of a plain 8-bit yuv420p 2x2-slice stream; sharing Parameters' array reads all of them correctly. Continuing into the QuantizationTableSets with the custom table then gives context_counts of 23,624,738 and 10,393,918,178 (RFC 9043 Sec 4.1.2 caps them at 32,768) and runs the decoder 77 bytes past the record, while the default table gives 666 and 7563 -- the same pair every other coder's record from the same source produces -- and ends exactly one byte past it, matching ffv1-blackbox-closed-mode-length. Fixture: tests/fixtures/rangetab_*."

[[source]]
id       = "ffv1-blackbox-gray"
kind     = "blackbox"
title    = "A gray FFV1 stream is colorspace_type 0 with chroma_planes 0 and both subsampling fields 0 -- indistinguishable from Yuv444p without chroma_planes"
acquired = "2026-09-02"
where    = "Local measurement, not a document: `ffmpeg -f lavfi -i \"testsrc2=size=96x64:rate=25:duration=0.04\" -pix_fmt gray -c:v ffv1 out.mkv` (ffmpeg 9.0.1). Its Configuration Record carries colorspace_type = 0, chroma_planes = 0, log2_h_chroma_subsample = log2_v_chroma_subsample = 0. This crate's format mapping keyed only on (colorspace_type, log2_h, log2_v), so every gray file decoded as Yuv444p -- at exactly the right output size, with two planes of whatever the frame allocator left behind. Fixture: tests/fixtures/gray_*."

[[source]]
id       = "ffv1-blackbox-prefix-totals"
kind     = "blackbox"
title    = "Measured whole-file before/after byte differences for the RGB, gray and custom-table decode fixes, replacing the extrapolated figures in commit 9fcb8bc2's message"
acquired = "2026-09-02"
where    = "Local measurement, not a document, and recorded here because commit 9fcb8bc2's message gave whole-file totals that were extrapolated from a single frame rather than measured -- they are wrong and these supersede them. Method: the three pre-fix behaviours (plane-major Line order for colorspace_type 1, the format mapping ignoring chroma_planes, and the private state array plus custom table for state_transition_delta) were each put back behind a temporary FFV1_OLD environment check, `cargo build --release -p vaco-cli` was run, and every stream decoded both ways against ffmpeg 9.0.1's own raw decode of the same file. Sources: `ffmpeg -f lavfi -i \"testsrc2=size=160x120:rate=25:duration=1\" -pix_fmt <fmt> -c:v ffv1 [-coder ...]`, 25 frames. Results, differing bytes out of the reference's total: gbrp -coder rice 1,434,005 / 1,440,000 before and 0 after; gbrp -coder range_def 1,435,693 / 1,440,000 before and 0 after; gray 478,674 / 480,000 before and 0 after; -coder range_tab produced no output at all before (`invalid data: ffv1: decoder has no configuration; call set_extradata first`, 0 of 720,000 bytes written) and 0 differing bytes after. The single-frame figures quoted in ffv1-blackbox-rct-interleave (57,600 / 57,165 / 56,363) were measured directly and stand."

