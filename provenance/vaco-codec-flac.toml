# Confirms two facts this crate's design depends on, both surprising enough
# to be worth recording as measurements rather than assumptions:
#
# - Claxon 0.4.3's frame-header parser never implements the "bit depth
#   comes from STREAMINFO" case (frame header code 0b000) at all — it
#   returns `Error::Unsupported("header without bits per sample info")`
#   outright, a `// TODO` left in its own source. This crate's encoder
#   therefore always writes an explicit bit-depth code (16 or 24), never
#   the STREAMINFO-deferred one, even though the sample-rate field's
#   equivalent "from STREAMINFO" case (0b0000) *is* handled fine (nothing
#   in Claxon's frame decode actually needs the sample rate value).
# - Claxon 0.4.3's Rice-partition decoder returns
#   `Error::Unsupported("unencoded binary is not yet implemented")` for
#   the escaped/unencoded partition (Rice parameter `0b1111`). This
#   crate's own encoder (`src/rice.rs`) therefore never emits that escape
#   code, capping its Rice parameter search at 14.
#
# Established by reading crates.io's cached claxon-0.4.3 source
# (frame.rs's `read_frame_header_or_eof` and `decode_rice_partition`)
# after a round-trip test produced exactly the first error message above.
[[source]]
id       = "claxon-0.4.3-decode-boundary-probe"
kind     = "blackbox"
title    = "Observed behaviour of the claxon 0.4.3 crate's FlacReader: which parts of RFC 9639's frame header and residual coding it actually implements"
acquired = "2026-08-28"
where    = "claxon 0.4.3 as vendored by crates.io, exercised via this crate's own encoder/decoder round-trip tests"

