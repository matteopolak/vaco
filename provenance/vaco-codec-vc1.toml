# The other three High Rate Inter escape-mode delta tables
# (NOT_LAST_DELTA_LEVEL_BY_RUN: 25, LAST_DELTA_LEVEL_BY_RUN: 31,
# LAST_DELTA_RUN_BY_LEVEL: 4 elements) are below the 32-element threshold,
# same as their Intra counterparts above.

# ESCMODE ([VlcEntry; 3]), ESCLVLSZ_CONSERVATIVE ([VlcEntry; 11]),
# ESCLVLSZ_EFFICIENT ([VlcEntry; 7]) and escrunsz_to_run_bits (now a
# `const fn` over a 4-arm match, not an array at all) are all below the
# 32-element threshold or are no longer a table in the schema's sense.
# Rows for all four were carried until this pass and are removed rather
# than left pointing at something the checker can never match again; the
# clause citations (SS7.1.4.7 Table 58, SS7.1.4.10 Tables 59/60,
# SS7.1.4.11 Table 61) are preserved in each item's own doc comment in
# `tables.rs`.

