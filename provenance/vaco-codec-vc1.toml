# `transform.rs`'s T8 ([[i32; 8]; 8], 8 top-level rows) and C8 ([i32; 8]) are
# both below the 32-element threshold as the checker counts top-level
# bracketed elements (T8 is a matrix, not a flat 64-element array), and
# `inverse_transform_8x8` is a function, not a table. A combined row for
# all three was carried until this pass; removed as stale rather than left
# unmatchable. Annex A.1 (Figure 157/159) is still cited in `transform.rs`'s
# own doc comment.
#
# `header.rs`'s `SequenceInfo`/`STRUCT_C` byte layout (Annex J.2 Table 263,
# Annex L Table 265) is a bitfield struct layout, not a `static`/`const`
# array, so it was never the kind of "table" this schema's automated check
# can track -- the row carried for it until this pass could never pass a
# re-verification and is removed for the same reason as the others above.
# The clean-room fact it recorded remains true and is kept as a comment in
# `header.rs` itself: three of STRUCT_C's five reserved-bit constants
# (Reserved4==1, Reserved5==0, Reserved6==1) were verified bit-for-bit
# against a real RCV file's own bytes before any decoder code was written.
