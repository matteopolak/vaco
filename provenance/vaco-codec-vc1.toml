source = "smpte-st421-2013"
clause = "SS11.5, Table 168 (I-Picture CBPCY VLC table)"
method = "transcribed"

# Checked against primary text a second time after this table's own
# is_prefix_free test failed on first transcription: symbol 61 had been
# copy-typed as (453, 11), a duplicate of symbol 29's entry, rather than
# its own printed value (1811, 13). Re-checked line by line against the
# source table before the fix, not just re-typed.

# DC_LOW_LUMA/DC_LOW_CHROMA/DC_HIGH_LUMA/DC_HIGH_CHROMA (SS11.7.1 Table 173,
# SS11.7.1 Table 174, SS11.7.2 Table 175, SS11.7.2 Table 176 respectively --
# all 120-entry Luma/Color-difference DC differential VLC tables, well over
# the 32-element threshold) carry no `[[table]]` row here. They are declared
# through the `dc_table!` macro (`tables.rs`), and `cargo xtask
# provenance-check`'s source scanner only recognises a literal `static`/
# `const NAME: [T; N] = [ … ];` header in the file's own text -- a macro
# invocation site (`dc_table!(DC_LOW_LUMA, [...], ...)`) never contains that
# literal pattern, so these four are structurally invisible to it regardless
# of how a row here names them. A row was carried for all four until this
# pass, and the check correctly flagged it as stale (no matching (file,
# name) pair) rather than silently trusting it. Removed rather than left as
# a record the tool can never re-verify; the crate's own module doc comment
# at the top of `tables.rs` still states the source (SMPTE ST 421:2013,
# fetched from pub.smpte.org, read cell-by-cell) for all four.

[[table]]
name   = "HIGH_RATE_INTRA_CODE"
file   = "crates/codec/vaco-codec-vc1/src/tables_ac_data.rs"
source = "smpte-st421-2013"
clause = "SS11.8.6, Table 219 (High Rate Intra AC coding set VLC table)"
method = "derived"

[[table]]
name   = "HIGH_RATE_INTRA_RUN_LEVEL"
file   = "crates/codec/vaco-codec-vc1/src/tables_ac_data.rs"
source = "smpte-st421-2013"
clause = "SS11.8.6, Table 220 (High Rate Intra AC coding set, indexed run/level)"
method = "derived"

[[table]]
name   = "HIGH_RATE_INTRA_NOT_LAST_DELTA_RUN_BY_LEVEL"
file   = "crates/codec/vaco-codec-vc1/src/tables_ac_data.rs"
source = "smpte-st421-2013"
clause = "SS11.8.6, Table 219-225 (High Rate Intra AC coding set, escape-mode 2 NotLastDeltaRunTable, indexed by level - 1)"
method = "derived"

# The other three High Rate Intra escape-mode delta tables
# (NOT_LAST_DELTA_LEVEL_BY_RUN: 15, LAST_DELTA_LEVEL_BY_RUN: 17,
# LAST_DELTA_RUN_BY_LEVEL: 4 elements) are below the 32-element threshold
# and carry no row of their own, same convention as every other small
# table in this crate.
#
# method = "derived", not "transcribed", for every table in this AC coding
# set: these were extracted programmatically from the PDF's own table
# cells by a script (not hand-retyped), then cross-checked by an automated
# prefix-free + entry-count-matches-the-spec's-own-stated-index-range test
# (tables.rs::tests::ac_coding_sets_are_prefix_free_and_run_level_covers_escape_range)
# before being used. This is the mitigation this project's own
# "how confident should a transcribed table be" lesson calls for on a
# table this large (340+ numeric entries across the set): removing the
# hand-transcription step rather than merely checking its output.

[[table]]
name   = "HIGH_RATE_INTER_CODE"
file   = "crates/codec/vaco-codec-vc1/src/tables_ac_data.rs"
source = "smpte-st421-2013"
