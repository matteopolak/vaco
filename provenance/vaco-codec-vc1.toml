# Source declared locally rather than in the shared provenance/sources.toml
# (a multi-writer hotspot) -- same pattern provenance/vaco-codec-vorbis.toml
# already uses.
[[source]]
id       = "smpte-st421-2013"
kind     = "spec"
title    = "SMPTE ST 421:2013, \"VC-1 Compressed Video Bitstream Format and Decoding Process\""
acquired = "2026-08-29"
where    = "https://pub.smpte.org/latest/st421/st0421-2013.pdf"

[[table]]
name   = "PQINDEX_TO_PQUANT"
file   = "crates/codec/vaco-codec-vc1/src/tables.rs"
