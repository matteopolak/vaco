file   = "crates/codec/vaco-codec-mpeg12/src/tables.rs"
source = "itu-t-h262"
clause = "§6.3.11, default matrix for intra blocks"
method = "transcribed"

# DEFAULT_NON_INTRA_MATRIX is `[16; 64]` — a single repeated value, not a
# 64-entry literal — so `provenance-check`'s element count does not see it
# as a large table. Its source is the same §6.3.11 text as
# DEFAULT_INTRA_MATRIX above: "The default matrix for non-intra blocks
# (both luminance and chrominance) is" a flat 16 at every position.

# QUANTISER_SCALE is `[[u8; 32]; 2]` — two 32-entry rows rather than one
# flat 64+-entry literal — so `provenance-check`'s element count does not
# see it as a large table either. Both rows (linear and non-linear
# quantiser_scale_code mappings, selected by q_scale_type) are transcribed
# from Table 7-6, "Relation between quantiser_scale and
# quantiser_scale_code".

# The MPEG-1 (ISO/IEC 11172-2) escape-coding rule implemented in
# block::decode_coefficients (an 8-bit sign-magnitude level, extended to
# 16 bits when the first byte is the 0x00/0x80 sentinel) is not
# transcribed from ISO/IEC 11172-2 directly — that document is not freely
# available and was not consulted (clean-room per this project's D6/D7
# rules). It is derived entirely from itu-t-h262's own free text, Annex
# D.9.3 ("Run-level escape syntax"), which states the exact field widths
# (14-bit and 22-bit escapes, level ranges -127..127 and -255..255) as a
# documented difference from this Specification's own 12-bit form; the
# sentinel-extension mechanism connecting those two widths is the only
# construction consistent with the stated widths and ranges, not a fact
# read from an unlicensed source.
