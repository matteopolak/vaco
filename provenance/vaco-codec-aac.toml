# Registry of constant tables >= 32 elements (D7/D9). Consumed by
# `cargo xtask provenance-check`.
#
# Every table here is ISO/IEC 14496-3 subpart 4's own data — the format,
# not an authorial choice — transcribed directly from two independently
# hosted copies of the primary text (the 2001 and 2009 editions; table
# numbers differ by a constant +56 offset between them, content identical).
# Two of the thirteen `swb_offset` tables (44.1/48 kHz and 11.025/12/16 kHz)
# were cross-checked byte-for-byte between both editions before the rest
# were transcribed the same way; all thirteen additionally pass a
# structural test (`swb_tables::tests::every_table_starts_at_zero_and_ends_at_the_transform_size`).
# All twelve Huffman tables pass an even stronger check: exact size against
# each codebook's own (unsigned, dim, lav) formula, prefix-freedom, and
# Kraft completeness (`spectral_tables::tests`).

[[table]]
name   = "SCALEFACTOR_HUFFMAN"
file   = "crates/codec/vaco-codec-aac/src/spectral_tables.rs"
source = "iso-14496-3"
clause = "subpart 4 Table 4.A.1 (differential scalefactor Huffman codebook)"
method = "transcribed"

