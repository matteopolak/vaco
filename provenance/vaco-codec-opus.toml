# CELT and SILK static tables, transcribed from RFC 6716's Appendix A
# reference implementation (BSD-licensed source embedded in the RFC itself,
# not the RFC's own prose numbering — Appendix A files don't carry clause
# numbers, so `clause` below names the source file and, where useful, the
# specific array or struct within it).

