# All tables below were extracted by scripts/extract_cdf.py, not retyped by
# hand: the script brace-matches each `Name[dims] = { ... }` block in the
# specification text and transliterates C-style `{}` nesting to Rust `[]`
# nesting, so the printed element order is preserved exactly. `method =
# "transcribed"` per this directory's own three-way distinction ("transcribed
# from the text" vs. "derived by evaluating an equation" vs. "probed from a
# binary") -- a script doing the copying instead of a person is still copying,
# not deriving.
#
# This gate only counts a multi-dimensional array's outermost dimension, so
# most of this crate's tables (the CDF tables in tables/default_cdf.rs; the
# quantizer tables in tables/quant.rs; Coeff_Base_Ctx_Offset and the smaller
# Sm_Weights_Tx_* rows in tables/conversion.rs) never trip the 32-element
# threshold despite being far larger in total -- every one of them still came
# from the same script and the same specification sections, recorded in this
# crate's own module docs (tables.rs, tables/*.rs, transform.rs) rather than
# repeated here entry by entry for tables the gate does not require.

