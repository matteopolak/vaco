# MPEG-TS and MPEG-PS probing, against reference-synthesised media.
schema = 1
suite  = "probe-mpegts"
tool   = "probe"
tier   = "core"
owner  = "@orchestrator"

[[media]]
id       = "mpeg2-ts"
source   = "generated://mpeg2.ts"
tags     = ["video"]
generate = ["-f", "lavfi", "-i", "testsrc=size=320x240:rate=25:d=1.2",
            "-c:v", "mpeg2video", "-f", "mpegts"]

[[media]]
id       = "mpeg2-ts-with-audio"
source   = "generated://mpeg2-audio.ts"
tags     = ["video", "audio"]
generate = ["-f", "lavfi", "-i", "testsrc=size=320x240:rate=25:d=1.2",
            "-f", "lavfi", "-i", "sine=frequency=440:duration=1.2",
            "-c:v", "mpeg2video", "-c:a", "mp2", "-f", "mpegts"]

[[media]]
id       = "mpeg2-ps"
source   = "generated://mpeg2.mpg"
tags     = ["video", "audio"]
generate = ["-f", "lavfi", "-i", "testsrc=size=320x240:rate=25:d=1.2",
            "-f", "lavfi", "-i", "sine=frequency=440:duration=1.2",
            "-c:v", "mpeg2video", "-c:a", "mp2", "-f", "vob"]

[[axis]]
name   = "section"
values = [
  { id = "format",   argv = ["-show_format"] },
  { id = "streams",  argv = ["-show_streams"] },
  { id = "both",     argv = ["-show_format", "-show_streams"] },
  { id = "packets",  argv = ["-show_packets"] },
  { id = "programs", argv = ["-show_programs"] },
]

[[axis]]
name   = "writer"
values = [
  { id = "default", argv = ["-of", "default"] },
  { id = "json",    argv = ["-of", "json"] },
  { id = "compact", argv = ["-of", "compact"] },
]

[[axis]]
name   = "input"
values = [{ id = "file", argv = ["-i", "{media}"] }]

[compare]
mode    = "exact-bytes"
capture = ["stdout", "exit-code"]
timeout = "30s"

[normalise]
invocation = ["bitexact", "hide-banner"]
