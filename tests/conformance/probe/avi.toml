# AVI probing, against reference-synthesised media (XF-01, issue #196).
#
# `generate` synthesises each file with the reference at run time and
# discards it (D6). AVI is one of the highest-registration families in the
# 276-component registry (`demux-avi`/`mux-avi`) without a probe suite yet.
schema = 1
suite  = "probe-avi"
tool   = "probe"
tier   = "core"
owner  = "@orchestrator"

[[media]]
id       = "mpeg4-video"
source   = "generated://mpeg4-video.avi"
tags     = ["video"]
generate = ["-f", "lavfi", "-i", "testsrc=size=320x240:rate=25:d=1.2",
            "-c:v", "mpeg4", "-f", "avi"]

[[media]]
id       = "mpeg4-and-pcm"
source   = "generated://mpeg4-and-pcm.avi"
tags     = ["video", "audio"]
generate = ["-f", "lavfi", "-i", "testsrc=size=320x240:rate=25:d=1.2",
            "-f", "lavfi", "-i", "sine=frequency=440:duration=1.2",
            "-c:v", "mpeg4", "-c:a", "pcm_s16le", "-f", "avi"]

[[axis]]
name   = "section"
values = [
  { id = "format",  argv = ["-show_format"] },
  { id = "streams", argv = ["-show_streams"] },
  { id = "both",    argv = ["-show_format", "-show_streams"] },
  { id = "packets", argv = ["-show_packets"] },
]

[[axis]]
name   = "writer"
values = [
  { id = "default", argv = ["-of", "default"] },
  { id = "json",    argv = ["-of", "json"] },
  { id = "xml",     argv = ["-of", "xml"] },
  { id = "compact", argv = ["-of", "compact"] },
  { id = "csv",     argv = ["-of", "csv"] },
  { id = "flat",    argv = ["-of", "flat"] },
  { id = "ini",     argv = ["-of", "ini"] },
]

[[axis]]
name   = "input"
values = [{ id = "file", argv = ["-i", "{media}"] }]

[compare]
mode    = "exact-bytes"
capture = ["stdout", "exit-code"]
timeout = "30s"

[normalise]
invocation = ["bitexact", "hide-banner"]
