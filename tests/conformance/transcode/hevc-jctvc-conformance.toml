# JCT-VC (H.265/HEVC) draft conformance bring-up (#442, T3-02n).
#
# Same methodology as `h264-jvt-conformance.toml` in this directory --
# differential against the reference `ffmpeg`'s own HEVC decode (D6), every
# case wraps its raw Annex-B elementary bitstream (`.bit`/`.bin`, as shipped
# by the JCT-VC HEVC_v1 archives) in an MP4 via the reference's own `-c copy`
# first, for the same measured reason: `vaco`'s raw-elementary-stream demux
# path assigns no packet timestamps, which is a demux-layer gap outside this
# crate, not a codec defect -- see the H.264 manifest's header for the full
# explanation and the byte-identical hand-verification this rests on.
#
# Tier `full` (nightly) for the same reason: corpus fetch needs
# `VACO_CORPUS_NETWORK=1` explicitly, which `smoke`/`core` do not set. Run
# with:
# `VACO_CORPUS_NETWORK=1 vaco-conformance run --suite jctvc-conformance --tier full`.
#
# What this subset leaves out: see vaco-corpus's `vaco-media.lock`, the
# `jctvc` section header.

schema = 1
suite  = "jctvc-conformance"
tool   = "transcode"
tier   = "full"
owner  = "@correctness-owner"


[[media]]
id       = "amp-a-samsung-7"
source   = "generated://amp-a-samsung-7.mp4"
generate = ["-fflags", "+genpts", "-i", "{corpus:jctvc-hevc-amp-a-samsung-7}", "-c", "copy", "-f", "mp4"]

