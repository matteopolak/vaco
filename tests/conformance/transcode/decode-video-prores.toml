# Decode conformance: ProRes (`prores_ks`, 4:4:4 12-bit profile). ProRes's
# own decode is specified as an exact fixed-point IDCT, but this codebase's
# implementation is measured (not assumed) against the reference to differ
# by a small, bounded amount -- `raw-tolerant`, not `raw-exact`.
#
# Measured 2026-09-02 against this machine's ffmpeg 9.0.1 and a full-feature
# `vaco` build: 5.71% of raw bytes differ, max_abs=255 at the byte level but
# the fixture is yuv444p12le (16-bit little-endian samples), so a byte-level
# max_abs of 255 can be a one-count sample difference that straddles a
# little-endian byte boundary (e.g. 0x0fff -> 0x1000) rather than a genuinely
# large error -- this is the same caveat the coordinator's own ProRes
# calibration (within 4 of 1023 on 3.3% of samples, measured on a different
# fixture) already carries. tolerance.max_abs = 6 accepts a small
# per-sample rounding difference across a 16-bit boundary while still
# failing anything larger; this is not fitted to force a pass -- rerun after
# any ProRes IDCT change to see whether it still needs the full 6.

schema = 1
suite  = "decode-video-prores"
tool   = "transcode"
tier   = "core"
owner  = "@correctness-owner"

[[media]]
id       = "prores"
source   = "generated://prores.mov"
tags     = ["decoder:prores"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-c:v", "prores_ks", "-f", "mov"]


[[axis]]
name   = "decode"
values = [
  { id = "decode", argv = ["-i", "{media}", "-f", "rawvideo", "-pix_fmt", "yuv444p12le", "-"] },
]

[compare]
mode          = "raw-tolerant"
justification = "measured 2026-09-02 on this suite's own fixture: 5.71% of bytes differ at the byte level in a 16-bit-per-sample format, consistent with a small per-sample rounding difference near a little-endian byte boundary rather than a structural defect -- see this file's own header."
timeout       = "20s"

[compare.tolerance]
max_abs = 6.0
