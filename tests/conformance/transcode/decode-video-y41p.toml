# Decode conformance: y41p, a packed 4:1:1 pixel format, muxed in MOV
# (the earlier raw-dump attempt was blocked by the reference's own
# rawvideo demuxer -- see decode-video-r10k-r210.toml's header for the
# same story). `raw-exact`: decode is a direct reinterpretation with no
# coefficient freedom.
#
# Measured 2026-09-02 against this machine's ffmpeg 9.0.1 and a
# full-feature `vaco` build: KNOWN DIVERGENCE, newly observed here --
# `vaco` refuses with "a stream being transcoded has no known input
# codec", the same reachability shape as decode-video-r10k-r210.toml. Not
# chased here.

schema = 1
suite  = "decode-video-y41p"
tool   = "transcode"
tier   = "core"
owner  = "@correctness-owner"

[[media]]
id       = "y41p"
source   = "generated://y41p.mov"
tags     = ["decoder:y41p"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-c:v", "y41p", "-f", "mov"]


[[axis]]
name   = "decode"
values = [
  { id = "decode", argv = ["-i", "{media}", "-f", "rawvideo", "-pix_fmt", "yuv411p", "-"] },
]

[compare]
mode    = "raw-exact"
capture = ["stdout", "exit-code"]
timeout = "20s"
