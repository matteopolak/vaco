# Decode conformance: PCM sample formats and the two lossless audio codecs
# whose own encode round-trips cleanly in a plain container (RFC/spec: PCM
# decode is a direct reinterpretation, no coefficient freedom; FLAC and ALAC
# are lossless by design). Differential against the reference's own decode
# of the identical fixture (D6), same methodology as h264-jvt-conformance.toml.
#
# Measured 2026-09-02 against this machine's ffmpeg 9.0.1 and a full-feature
# `vaco` build: all fifteen decode byte-for-byte identical to the reference's
# own decode of the same fixture (`EXACT`, not merely non-crashing) -- these
# are a working baseline, not an expected-red set.

schema = 1
suite  = "decode-audio-pcm-lossless"
tool   = "transcode"
tier   = "core"
owner  = "@correctness-owner"

[[media]]
id       = "pcm-s16le"
source   = "generated://pcm-s16le.wav"
tags     = ["decoder:pcm_s16le"]
generate = ["-f", "lavfi", "-i", "sine=frequency=440:duration=1", "-c:a", "pcm_s16le", "-f", "wav"]

[[media]]
id       = "pcm-s16be"
source   = "generated://pcm-s16be.aiff"
tags     = ["decoder:pcm_s16be"]
generate = ["-f", "lavfi", "-i", "sine=frequency=440:duration=1", "-c:a", "pcm_s16be", "-f", "aiff"]

