# Decode conformance: rgb24 still-image decoders sharing a `rgb24`
# decode target. Each of these formats is lossless by design (a palette or
# direct-sample dump, no transform quantisation) -- `raw-exact`.
#
# Every image decode case in this file currently hits the same block, so
# it is stated once here rather than sixteen times: `vaco` refuses each
# fixture with "this container needs timestamps and the packet has none"
# -- `vaco-demux-image2` does not stamp a timestamp on the frame(s) it
# demuxes, and the transcode pipeline's filtering stage refuses any packet
# that arrives without one. This is a demux-layer gap, not (necessarily)
# the whole story behind the previously-known "9 of 13 image formats report
# 0x0, pix_fmt=unknown" probe defect, but it blocks every one of these
# codecs identically and is worth naming precisely rather than re-deriving
# per file. Not fixed here (out of the codec crates named off-limits for
# this pass, and this is format/demux code besides) -- recorded for
# whoever owns vaco-demux-image2.

# Measured 2026-09-02 against this machine's ffmpeg 9.0.1 and a full-feature
# `vaco` build.

schema = 1
suite  = "decode-image-rgb24"
tool   = "transcode"
tier   = "core"
owner  = "@correctness-owner"

[[media]]
id       = "png"
source   = "generated://png.png"
tags     = ["decoder:png"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-frames:v", "1", "-update", "1", "-c:v", "png", "-f", "image2"]

[[media]]
id       = "jpegls"
source   = "generated://jpegls.jls"
tags     = ["decoder:jpegls"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-frames:v", "1", "-update", "1", "-c:v", "jpegls", "-f", "image2"]

[[media]]
id       = "tiff"
source   = "generated://tiff.tiff"
tags     = ["decoder:tiff"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-frames:v", "1", "-update", "1", "-c:v", "tiff", "-f", "image2"]

[[media]]
id       = "pcx"
source   = "generated://pcx.pcx"
tags     = ["decoder:pcx"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-frames:v", "1", "-update", "1", "-c:v", "pcx", "-f", "image2"]

[[media]]
id       = "xwd"
source   = "generated://xwd.xwd"
tags     = ["decoder:xwd"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-frames:v", "1", "-update", "1", "-c:v", "xwd", "-f", "image2"]

[[media]]
id       = "qoi"
source   = "generated://qoi.qoi"
tags     = ["decoder:qoi"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-frames:v", "1", "-update", "1", "-c:v", "qoi", "-f", "image2"]

[[media]]
id       = "pam"
source   = "generated://pam.pam"
tags     = ["decoder:pam"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-frames:v", "1", "-update", "1", "-c:v", "pam", "-f", "image2"]

[[media]]
id       = "ppm"
source   = "generated://ppm.ppm"
tags     = ["decoder:ppm"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-frames:v", "1", "-update", "1", "-pix_fmt", "rgb24", "-c:v", "ppm", "-f", "image2"]


[[axis]]
name   = "decode"
values = [
  { id = "decode", argv = ["-i", "{media}", "-f", "rawvideo", "-pix_fmt", "rgb24", "-"] },
]

[compare]
mode    = "raw-exact"
capture = ["stdout", "exit-code"]
timeout = "20s"
