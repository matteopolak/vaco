# Decode conformance: `rawvideo`, the plain uncompressed codec (distinct
# from the packed-format families like v210/r10k which are not covered
# here -- see planning/CONFORMANCE-FINDINGS.md #68 for why). Decode is a
# direct reinterpretation with no coefficient freedom at all, so
# `raw-exact` is the only defensible bar.
#
# Measured 2026-09-02 against this machine's ffmpeg 9.0.1 and a full-feature
# `vaco` build: KNOWN DIVERGENCE, newly observed here -- `vaco` refuses a
# valid `-f rawvideo -pix_fmt yuv420p -s 64x48` input the reference reads
# without complaint ("Invalid data found when processing input"). Not
# chased here.

schema = 1
suite  = "decode-video-rawvideo"
tool   = "transcode"
tier   = "core"
owner  = "@correctness-owner"

[[media]]
id       = "rawvideo"
source   = "generated://rawvideo.raw"
tags     = ["decoder:rawvideo"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-pix_fmt", "yuv420p", "-c:v", "rawvideo", "-f", "rawvideo"]


[[axis]]
name   = "decode"
values = [
  { id = "decode", argv = ["-f", "rawvideo", "-pix_fmt", "yuv420p", "-s", "64x48", "-i", "{media}", "-f", "rawvideo", "-pix_fmt", "yuv420p", "-"] },
]

[compare]
mode    = "raw-exact"
capture = ["stdout", "exit-code"]
timeout = "20s"
