# Decode conformance: H.264 and HEVC, local and `tier = "core"`.
# `h264-jvt-conformance.toml` and `hevc-jctvc-conformance.toml` already
# differential-test these codecs against real conformance corpora, but both
# are `tier = "full"` and need `VACO_CORPUS_NETWORK=1` -- neither runs in a
# default `just conformance` invocation. This is the smoke-level equivalent
# a `core` run actually exercises, at 4:2:0 (the chroma format this
# codebase's decoders currently support -- CL/#419 tracks 4:4:4/4:2:2
# separately; a testsrc source given no explicit `-pix_fmt` autoselects a
# wider chroma format on this ffmpeg build and both decoders correctly
# refuse it, which is why `-pix_fmt yuv420p` is forced on the encode side
# here).
#
# Both require `--features patent-encumbered-h264-decode` /
# `patent-encumbered-hevc-decode` respectively and skip honestly (D4) when
# built without them.
#
# Measured 2026-09-02 against this machine's ffmpeg 9.0.1 and a full-feature
# `vaco` build: both EXACT, byte for byte -- a working baseline for the
# mainstream 4:2:0 case.

schema = 1
suite  = "decode-video-h264-hevc-core"
tool   = "transcode"
tier   = "core"
owner  = "@correctness-owner"

[[media]]
id       = "h264"
source   = "generated://h264.mp4"
tags     = ["decoder:h264"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-pix_fmt", "yuv420p", "-c:v", "libx264", "-f", "mp4"]

[[media]]
id       = "hevc"
source   = "generated://hevc.mp4"
tags     = ["decoder:hevc"]
generate = ["-f", "lavfi", "-i", "testsrc=size=64x48:rate=5:duration=1", "-pix_fmt", "yuv420p", "-c:v", "libx265", "-f", "mp4"]


[[axis]]
name   = "decode"
values = [
  { id = "decode", argv = ["-i", "{media}", "-f", "rawvideo", "-pix_fmt", "yuv420p", "-"] },
]

[compare]
mode    = "raw-exact"
capture = ["stdout", "exit-code"]
timeout = "30s"
