# FT-6.1 (#500)'s filter category: the first multi-input `filter`-tool
# suite, closing the gap `filterexec.rs` used to have ("only builds
# single-source-node graphs" -- see that module's own doc, "Multi-input
# cases in a suite file", for the convention this suite exercises).
#
# `maskedmerge` (`vaco-filter-key`) is a real 3-input lockstep filter
# (base/overlay/mask, no framesync timeline -- see its own module doc),
# which makes it a good first multi-input target precisely because it is
# *not* 2 inputs: if the design only worked for exactly two, this suite
# would not have caught that.
#
# Sources are deliberately not flat where the formula's own arithmetic is
# what is under test: `mask` varies per column (`X*25`) so the blend ratio
# is exercised across its own range, not just the two saturated endpoints
# (mask=0 keeps base exactly, mask=max takes overlay exactly -- true even
# for a formula that only gets the *endpoints* right and something else
# wrong in between, the same "pick sources that can discriminate" lesson
# this campaign has paid for on `waveform`/`vectorscope`/`sobel`).

schema = 1
suite  = "filter-vaco-filter-key-multi"
tool   = "filter"
tier   = "core"
owner  = "@filter-key-owner"

[[media]]
id       = "base-10"
source   = "generated://base-10.raw"
tags     = ["video"]
# All three of this suite's `[[media]]` are `fixed`: none of them is a
# natural per-case iteration axis (there is no "vary the container, keep
# the rest" dimension for a fixed base/overlay/mask role the way a real
# input-format axis would have), so every input is named explicitly via
# `extra_media` below instead of being picked up by `Suite::expand`'s
# per-case media loop -- three `[[media]]` entries, one case, not three.
fixed    = true
generate = ["-f", "lavfi", "-i", "color=c=gray:s=10x10:d=1:r=25",
            "-vf", "geq=lum='50':cb=128:cr=128",
            "-frames:v", "1", "-pix_fmt", "gray8", "-f", "rawvideo"]

[[media]]
id       = "overlay-10"
source   = "generated://overlay-10.raw"
tags     = ["video"]
fixed    = true
generate = ["-f", "lavfi", "-i", "color=c=gray:s=10x10:d=1:r=25",
            "-vf", "geq=lum='200':cb=128:cr=128",
            "-frames:v", "1", "-pix_fmt", "gray8", "-f", "rawvideo"]

[[media]]
id       = "mask-10-ramp"
source   = "generated://mask-10-ramp.raw"
tags     = ["video"]
fixed    = true
generate = ["-f", "lavfi", "-i", "color=c=black:s=10x10:d=1:r=25",
            "-vf", "geq=lum='X*25':cb=128:cr=128",
            "-frames:v", "1", "-pix_fmt", "gray8", "-f", "rawvideo"]


[[media]]
id       = "mm-source-10"
source   = "generated://mm-source-10.raw"
tags     = ["video"]
fixed    = true
generate = ["-f", "lavfi", "-i", "color=c=gray:s=10x10:d=1:r=25",
            "-vf", "geq=lum='128':cb=128:cr=128",
            "-frames:v", "1", "-pix_fmt", "gray8", "-f", "rawvideo"]

[[media]]
id       = "mm-filter1-10"
source   = "generated://mm-filter1-10.raw"
tags     = ["video"]
fixed    = true
generate = ["-f", "lavfi", "-i", "color=c=black:s=10x10:d=1:r=25",
            "-vf", "geq=lum='X*20':cb=128:cr=128",
            "-frames:v", "1", "-pix_fmt", "gray8", "-f", "rawvideo"]

[[media]]
id       = "mm-filter2-10"
source   = "generated://mm-filter2-10.raw"
tags     = ["video"]
fixed    = true
generate = ["-f", "lavfi", "-i", "color=c=black:s=10x10:d=1:r=25",
            "-vf", "geq=lum='255-X*20':cb=128:cr=128",
            "-frames:v", "1", "-pix_fmt", "gray8", "-f", "rawvideo"]

[[axis]]
name   = "filter"
values = [
  { id = "maskedmerge-default", extra_media = ["base-10", "overlay-10", "mask-10-ramp"],
    argv = ["{media:base-10}", "maskedmerge", "", "gray8", "10", "10",
            "gray8", "10", "10",
            "{media:overlay-10}", "gray8", "10", "10",
            "{media:mask-10-ramp}", "gray8", "10", "10"] },
  # `maskedmax`/`maskedmin` (`masked_pick.rs`) go through `Paired`, the
  # *other* multi-input shape this crate uses (`maskedmerge` is a
  # hand-rolled `Filter`, not `Paired`) -- a second case on purpose, to
  # prove the harness's multi-input support does not just happen to work
  # for the one shape it was built against.
  { id = "maskedmax-default", extra_media = ["mm-source-10", "mm-filter1-10", "mm-filter2-10"],
    argv = ["{media:mm-source-10}", "maskedmax", "", "gray8", "10", "10",
            "gray8", "10", "10",
            "{media:mm-filter1-10}", "gray8", "10", "10",
            "{media:mm-filter2-10}", "gray8", "10", "10"] },
  { id = "maskedmin-default", extra_media = ["mm-source-10", "mm-filter1-10", "mm-filter2-10"],
    argv = ["{media:mm-source-10}", "maskedmin", "", "gray8", "10", "10",
            "gray8", "10", "10",
            "{media:mm-filter1-10}", "gray8", "10", "10",
            "{media:mm-filter2-10}", "gray8", "10", "10"] },
]

[compare]
mode    = "raw-exact"
timeout = "10s"

[normalise]
invocation = ["bitexact", "hide-banner"]
