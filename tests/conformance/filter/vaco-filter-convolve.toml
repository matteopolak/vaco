# FT-6.1 (#500)'s filter category, fourth crate: `vaco-filter-convolve`
# (sobel/prewitt/roberts/kirsch/scharr edge operators, morpho/median).
#
# `median`'s default `percentile=0.5` (the median proper) is the one
# value where "which of the two middle ranks, for an even window" and
# off-by-one indexing questions can hide; `percentile=0.25` forces a
# specific, non-ambiguous rank, and `radiusV` != `radius` (an anisotropic
# window) is a second, independent axis the default `radiusV=0` collapses
# into "just use radius".
#
# `sobel`/`prewitt` border handling (2026-08-28): the previous pass found
# a real divergence — this crate's `Kernel::value_at` forced a hard `0`
# at any pixel whose kernel window went out of bounds, but the reference
# does not. A corner/edge probe (all-distinct-value 5x5 source; see
# `src/convolution.rs`'s doc, "Border, pinned 2026-08-28") pinned the
# actual rule as `reflect-101` (mirror the out-of-bounds tap back across
# the border without duplicating the edge pixel, independently per axis,
# including simultaneously at corners) and ruled out both zero-pad and
# plain clamp-to-edge. `Kernel::value_at` now implements this, verified
# with zero mismatches across all 400 pixels of `gray8-ramp-20` (every
# border row/column and all four corners) for both `sobel` and `prewitt`.
# Cases re-added below.
#
# `scharr` is not in this suite: the same exhaustive check found a
# *different*, unrelated divergence in `scharr` specifically -- 18/400
# interior (non-border) pixels mismatch by exactly one count, which is
# not explained by the border rule at all (these pixels' whole 3x3 window
# is in-bounds), and `src/edge.rs`'s own doc goes on to prove no function
# of the documented inputs can explain it at all (two identical gradient
# vectors, two different reference outputs). Under the 2026-08-28 owner
# ruling in `AGENT-CONSTRAINTS.md`, a proven, position-uncorrelated
# max-1-count scatter like this ships under a tolerance rather than
# staying excluded -- see the sibling `vaco-filter-convolve-scharr.toml`,
# `raw-tolerant`, not this file's `raw-exact`.

schema = 1
suite  = "filter-vaco-filter-convolve"
tool   = "filter"
tier   = "core"
owner  = "@filter-convolve-owner"

[[media]]
id       = "gray8-ramp-20"
source   = "generated://gray8-ramp-20.raw"
tags     = ["video"]
generate = ["-f", "lavfi", "-i", "color=c=black:s=20x20:d=1:r=25",
            "-vf", "geq=lum='mod(X*7+Y*11,256)':cb=128:cr=128",
            "-frames:v", "1", "-pix_fmt", "gray8", "-f", "rawvideo"]

[[axis]]
name   = "filter"
values = [
  { id = "median-default",      argv = ["{media}", "median", "radius=2", "gray8", "20", "20", "gray8", "20", "20"] },
  { id = "median-percentile25", argv = ["{media}", "median", "radius=2:percentile=0.25", "gray8", "20", "20", "gray8", "20", "20"] },
  { id = "median-anisotropic",  argv = ["{media}", "median", "radius=3:radiusV=1", "gray8", "20", "20", "gray8", "20", "20"] },
  { id = "sobel-default",       argv = ["{media}", "sobel", "", "gray8", "20", "20", "gray8", "20", "20"] },
  { id = "sobel-scale-delta",   argv = ["{media}", "sobel", "scale=2:delta=5", "gray8", "20", "20", "gray8", "20", "20"] },
  { id = "prewitt-default",     argv = ["{media}", "prewitt", "", "gray8", "20", "20", "gray8", "20", "20"] },
]

[compare]
mode    = "raw-exact"
timeout = "10s"

[normalise]
invocation = ["bitexact", "hide-banner"]
