# Pinned nightly, not stable (D22 amends D12).
#
# D12 moved this project off nightly because `std::simd` was the only thing
# requiring it, and `fearless_simd` covers that on stable. The owner has since
# ruled that nightly is welcome where it buys performance or capability, so the
# pin moves to nightly and the D12 reasoning is superseded on the channel, not
# on the substance: fearless_simd stays, and nothing here reintroduces
# `#![feature(portable_simd)]` by default.
#
# What nightly buys that stable did not:
#   * `#![feature(likely_unlikely)]` -- `std::hint::{likely, unlikely,
#     cold_path}`, which D21 wants for hot-path branch layout and which do NOT
#     compile on stable.
#   * `std::simd` if a kernel ever needs it directly.
#
# Pinned to an EXACT nightly date, not the floating `nightly` channel. This is
# the one part of D12's reasoning that still binds: a floating channel means a
# `rustup update` can change codegen underneath a performance baseline, and
# this project's whole premise is measurement against a reference binary. The
# date pin also matches the toolchain `cargo +nightly fuzz` already used, so
# the workspace and the fuzzers share one compiler.
#
# Verified: `cargo check --workspace --all-targets` passes on this toolchain.
#
# MSRV no longer applies -- the library crates are nightly-only while this pin
# stands. That is a real cost for downstream consumers and is accepted
# deliberately; the shipped artefact is a binary, which does not care.
#
[toolchain]
channel = "nightly-2026-08-07"
components = ["rustfmt", "clippy"]
