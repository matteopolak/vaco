# Fuzz targets for the whole workspace.
#
# GENERATED by `cargo xtask gen-fuzz`. Do not edit.
#
# To add a target: create `fuzz/fuzz_targets/<name>.rs` and give it the
# header line `//! fuzz-crate: <your-crate>`. Then run
# `cargo xtask gen-fuzz`. The dependency, the feature, the [[bin]] block
# and the `default` entry are all derived from that one line, so no two
# agents ever edit the same region of this file.
#
# EXCLUDED from the root workspace (see the `exclude` key in /Cargo.toml),
# so this manifest has its own lockfile and its own dependency set.
# `libfuzzer-sys` and `arbitrary` live here and nowhere else — they never
# enter a shipped artifact's dependency graph, which is what the D2 unsafe
# audit checks.

[package]
name = "vaco-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
vaco-bitstream = { path = "../crates/core/vaco-bitstream" }
vaco-chlayout = { path = "../crates/model/vaco-chlayout" }
vaco-cli-core = { path = "../crates/app/vaco-cli-core" }
vaco-codec-cabac = { path = "../crates/signal/vaco-codec-cabac" }
vaco-codec-core = { path = "../crates/signal/vaco-codec-core" }
vaco-codec-golomb = { path = "../crates/signal/vaco-codec-golomb" }
vaco-color = { path = "../crates/model/vaco-color" }
vaco-conformance = { path = "../crates/tool/vaco-conformance" }
vaco-core = { path = "../crates/core/vaco-core" }
vaco-expr = { path = "../crates/core/vaco-expr" }
vaco-filter-core = { path = "../crates/filter/vaco-filter-core" }
vaco-format-core = { path = "../crates/format/vaco-format-core" }
vaco-format-isom = { path = "../crates/format/vaco-format-isom" }
vaco-format-nalu = { path = "../crates/format/vaco-format-nalu" }
vaco-frame = { path = "../crates/model/vaco-frame" }
vaco-io = { path = "../crates/io/vaco-io" }
vaco-limits = { path = "../crates/core/vaco-limits" }
vaco-packet = { path = "../crates/model/vaco-packet" }
vaco-parse-aac = { path = "../crates/codec/vaco-parse-aac" }
vaco-parse-h264 = { path = "../crates/codec/vaco-parse-h264" }
vaco-parse-opus = { path = "../crates/codec/vaco-parse-opus" }
vaco-pixfmt = { path = "../crates/model/vaco-pixfmt" }
vaco-pool = { path = "../crates/model/vaco-pool" }
vaco-protocol-core = { path = "../crates/io/vaco-protocol-core" }
vaco-resample = { path = "../crates/signal/vaco-resample" }
vaco-sampfmt = { path = "../crates/model/vaco-sampfmt" }
vaco-scale = { path = "../crates/signal/vaco-scale" }
vaco-textformat = { path = "../crates/app/vaco-textformat" }

[features]
default = [
    "bitstream",
    "chlayout",
    "cli-core",
    "codec-cabac",
    "codec-core",
    "codec-golomb",
    "color",
    "conformance",
    "core",
    "expr",
    "filter-core",
    "format-core",
    "format-isom",
    "format-nalu",
    "frame",
    "io",
    "limits",
    "packet",
    "parse-aac",
    "parse-h264",
    "parse-opus",
    "pool",
    "protocol-core",
    "resample",
    "sampfmt",
    "scale",
    "textformat",
]
bitstream = []
chlayout = []
cli-core = []
codec-cabac = []
codec-core = []
codec-golomb = []
color = []
conformance = []
core = []
expr = []
filter-core = []
format-core = []
format-isom = []
format-nalu = []
frame = []
io = []
limits = []
packet = []
parse-aac = []
parse-h264 = []
parse-opus = []
pool = []
protocol-core = []
resample = []
sampfmt = []
scale = []
textformat = []

# Overflow checks ON in the profile the fuzzer actually runs, so arithmetic
# overflow is a finding rather than a silent wrap (plan 13 §2.2.1). The shipped
# release profile keeps them off for speed; the nightly `release-overflow` job
# closes the gap for everything else.
[profile.release]
overflow-checks = true
debug-assertions = true

