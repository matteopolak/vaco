# Fuzz targets for the whole workspace.
#
# EXCLUDED from the root workspace (see the `exclude` key in /Cargo.toml), so
# this manifest has its own lockfile and its own dependency set. `libfuzzer-sys`
# and `arbitrary` live here and nowhere else — they never enter a shipped
# artifact's dependency graph, which is what the D2 unsafe audit checks.
#
# ADDING TARGETS (for the agent who owns the crate being fuzzed):
#   1. add your crate under [dependencies] as a path dependency;
#   2. add a feature named after your crate to [features] and to `default`;
#   3. add one [[bin]] per target with `required-features` set to that feature.
#
# The feature gate is what stops `cargo fuzz build` from compiling every target
# in the project when someone wants one (plan 13 §2.1).
[package]
name = "vaco-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
vaco-bitstream = { path = "../crates/core/vaco-bitstream" }
vaco-core = { path = "../crates/core/vaco-core" }
vaco-limits = { path = "../crates/core/vaco-limits" }
vaco-textformat = { path = "../crates/app/vaco-textformat" }
vaco-codec-core = { path = "../crates/signal/vaco-codec-core" }
vaco-conformance = { path = "../crates/tool/vaco-conformance" }
vaco-io = { path = "../crates/io/vaco-io" }
vaco-protocol-core = { path = "../crates/io/vaco-protocol-core" }

[features]
default = ["bitstream", "limits", "core", "io", "protocol-core", "codec-core", "textformat"]
bitstream = []
limits = []
core = []
codec-core = []
conformance = []
io = []
protocol-core = []
textformat = []

# Overflow checks ON in the profile the fuzzer actually runs, so arithmetic
# overflow is a finding rather than a silent wrap (plan 13 §2.2.1). The shipped
# release profile keeps them off for speed; the nightly `release-overflow` job
# closes the gap for everything else.
[profile.release]
debug = 1
overflow-checks = true

# ------------------------------------------------------------- vaco-bitstream

[[bin]]
name = "bitreader_arbitrary"
path = "fuzz_targets/bitreader_arbitrary.rs"
test = false
doc = false
required-features = ["bitstream"]

[[bin]]
name = "golomb_arbitrary"
path = "fuzz_targets/golomb_arbitrary.rs"
test = false
doc = false
required-features = ["bitstream"]

[[bin]]
name = "bitwriter_roundtrip"
path = "fuzz_targets/bitwriter_roundtrip.rs"
test = false
doc = false
required-features = ["bitstream"]

[[bin]]
name = "annexb_nal_iter"
path = "fuzz_targets/annexb_nal_iter.rs"
test = false
doc = false
required-features = ["bitstream"]

[[bin]]
name = "rbsp_roundtrip"
path = "fuzz_targets/rbsp_roundtrip.rs"
test = false
doc = false
required-features = ["bitstream"]

[[bin]]
name = "bytereader_arbitrary"
path = "fuzz_targets/bytereader_arbitrary.rs"
test = false
doc = false
required-features = ["bitstream"]

# ---------------------------------------------------------------- vaco-limits

[[bin]]
name = "limit_budget"
path = "fuzz_targets/limit_budget.rs"
test = false
doc = false
required-features = ["limits"]

# --- vaco-core: the user-facing CLI grammars. Each parser is reachable from an
# --- untrusted command line, so each gets a target (D6).
[[bin]]
name = "core_parse_duration"
path = "fuzz_targets/core_parse_duration.rs"
test = false
doc = false
required-features = ["core"]

[[bin]]
name = "core_parse_color"
path = "fuzz_targets/core_parse_color.rs"
test = false
doc = false
required-features = ["core"]

[[bin]]
name = "core_parse_geometry"
path = "fuzz_targets/core_parse_geometry.rs"
test = false
doc = false
required-features = ["core"]

[[bin]]
name = "core_dict_parse"
path = "fuzz_targets/core_dict_parse.rs"
test = false
doc = false
required-features = ["core"]

[[bin]]
name = "core_escape_roundtrip"
path = "fuzz_targets/core_escape_roundtrip.rs"
test = false
doc = false
required-features = ["core"]

[[bin]]
name = "core_rational"
path = "fuzz_targets/core_rational.rs"
test = false
doc = false
required-features = ["core"]

# --- vaco-io / vaco-protocol-core: both take input an attacker chooses. A URL
# --- arrives from a playlist; a byte stream arrives from anywhere at all.

[[bin]]
name = "io_url_split"
path = "fuzz_targets/io_url_split.rs"
test = false
doc = false
required-features = ["protocol-core"]

[[bin]]
name = "io_buffered_reader"
path = "fuzz_targets/io_buffered_reader.rs"
test = false
doc = false
required-features = ["io"]

# --- vaco-conformance: two hand-written parsers. The TOML reader backs the
# --- manifests and the divergence register; the reference-output parsers
# --- consume another process's stdout. Neither may panic (D6).
[[bin]]
name = "conformance_toml"
path = "fuzz_targets/conformance_toml.rs"
test = false
doc = false
required-features = ["conformance"]

[[bin]]
name = "conformance_ref_output"
path = "fuzz_targets/conformance_ref_output.rs"
test = false
doc = false
required-features = ["conformance"]

# ------------------------------------------------------------ vaco-codec-core
#
# The untrusted input here is the *call sequence*, not a byte stream: the
# send/receive machine and the parser harness are what every codec and every
# parser in the project runs through, so a hang or a lost frame in either is a
# hang or a lost frame everywhere.

[[bin]]
name = "codec_send_receive"
path = "fuzz_targets/codec_send_receive.rs"
test = false
doc = false
required-features = ["codec-core"]

[[bin]]
name = "codec_parser_driver"
path = "fuzz_targets/codec_parser_driver.rs"
test = false
doc = false
required-features = ["codec-core"]

[[bin]]
name = "codec_picture_bands"
path = "fuzz_targets/codec_picture_bands.rs"
test = false
doc = false
required-features = ["codec-core"]

# --- vaco-textformat: the escaping tables are the only place in the writer
# --- framework that transforms attacker-controlled bytes (container metadata
# --- reaches them verbatim), so they get a target (D6).

[[bin]]
name = "textformat_escape"
path = "fuzz_targets/textformat_escape.rs"
test = false
doc = false
required-features = ["textformat"]
