# Fuzz targets for the whole workspace.
#
# GENERATED by `cargo xtask gen-fuzz`. Do not edit.
#
# To add a target: create `fuzz/fuzz_targets/<name>.rs` and give it the
# header line `//! fuzz-crate: <your-crate>`. Then run
# `cargo xtask gen-fuzz`. The dependency, the feature, the [[bin]] block
# and the `default` entry are all derived from that one line, so no two
# agents ever edit the same region of this file.
#
# EXCLUDED from the root workspace (see the `exclude` key in /Cargo.toml),
# so this manifest has its own lockfile and its own dependency set.
# `libfuzzer-sys` and `arbitrary` live here and nowhere else — they never
# enter a shipped artifact's dependency graph, which is what the D2 unsafe
# audit checks.
#
# Every path dependency below is `optional = true`, gated behind the
# feature named after the crate that declares it. `default` enables every
# feature, so a plain `cargo fuzz run <target>` still builds everything —
# but `cargo fuzz run <target> --no-default-features --features <feature>`
# builds only that target's own crate and whatever it references, so a
# syntax error in an unrelated crate cannot block it.

[package]
name = "vaco-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
