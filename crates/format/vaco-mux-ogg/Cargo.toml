[package]
name = "vaco-mux-ogg"
description = "Ogg muxer, plus oga/ogv/opus/spx alias registrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
# Shares the page header, segment-table (lacing) shape and the RFC 3533
# CRC-32 with the demuxer's reader — one definition of what a page *is*
# rather than two (D19). See `docs/format/vaco-mux-ogg.md`.
vaco-demux-ogg = { path = "../vaco-demux-ogg" }

[dev-dependencies]
proptest.workspace = true
vaco-format-fixtures = { path = "../vaco-format-fixtures" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
