# Registry fragment, per the frozen schema in planning/19-parallel-execution.md
# §3.4.
#
# Written late: this fragment was missed when FM-54 (#612) originally
# landed, leaving `vaco-format-spdif` demuxing/muxing but absent from
# `cargo run -p xtask -- gen-registry`'s output. Found and fixed while
# working the next package in this same series (FM-36/NUT, #594) and
# noticing there was no `vaco-component.toml` in this crate at all.
#
# `vaco_format_spdif::S337M_DEMUXER` used to collide here with
# `vaco-demux-raw`'s own demuxer named "s337m"
# (`vaco_demux_raw::bitstream::DEMUXER_S337M`) — `gen-registry`'s
# `check_unique` rejects a same-kind name collision across crates, so only
# one could ever be registered. Resolved: this crate's `S337M_DEMUXER`
# actually parses the SMPTE 337M burst preamble (`Pa`/`Pb` sync words,
# `Pc`/`Pd` data-type/length) and is measured byte-identical against
# `ffmpeg -f spdif`; `vaco-demux-raw`'s entry was a `Framing::FixedBlock`
# stand-in with no real framing, added by a mechanical sweep of ffmpeg's
# raw-demuxer names. `vaco-demux-raw` dropped its registration (kept the
# dead code, per D19 there is exactly one real implementation now) and this
# is that implementation's registration. See `planning/TECH-DEBT.md`'s
# "`s337m` is registered twice" entry for the full writeup, now marked
# resolved.

[[component]]
kind       = "demuxer"
name       = "spdif"
long_name  = "IEC 61937 (compressed data in S/PDIF)"
feature    = "demux-spdif"
ctor       = "vaco_format_spdif::DEMUXER"

[[component]]
kind       = "demuxer"
name       = "s337m"
long_name  = "SMPTE 337M"
feature    = "demux-spdif"
ctor       = "vaco_format_spdif::S337M_DEMUXER"

[[component]]
kind       = "muxer"
name       = "spdif"
long_name  = "IEC 61937 (used on S/PDIF - IEC958)"
feature    = "mux-spdif"
ctor       = "vaco_format_spdif::MUXER"
extensions = "spdif"
