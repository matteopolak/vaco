# Registry fragment, per the frozen schema in planning/19-parallel-execution.md
# §3.4.
#
# Written late: this fragment was missed when FM-54 (#612) originally
# landed, leaving `vaco-format-spdif` demuxing/muxing but absent from
# `cargo run -p xtask -- gen-registry`'s output. Found and fixed while
# working the next package in this same series (FM-36/NUT, #594) and
# noticing there was no `vaco-component.toml` in this crate at all.
#
# `vaco_format_spdif::S337M_DEMUXER` is deliberately NOT registered here:
# `vaco-demux-raw` already registers a demuxer named "s337m"
# (`vaco_demux_raw::bitstream::DEMUXER_S337M`), and `gen-registry`'s
# `check_unique` rejects a same-kind name collision across crates (see
# `xtask/src/registry.rs`'s `duplicate_names_within_a_kind_are_rejected`
# test) — registering both would fail the gate. This is a genuine
# two-implementations-of-one-format situation, not a naming accident; see
# `planning/TECH-DEBT.md` for the writeup and who needs to decide which one
# the registry should keep.

[[component]]
kind       = "demuxer"
name       = "spdif"
long_name  = "IEC 61937 (compressed data in S/PDIF)"
feature    = "demux-spdif"
ctor       = "vaco_format_spdif::DEMUXER"

[[component]]
kind       = "muxer"
name       = "spdif"
long_name  = "IEC 61937 (used on S/PDIF - IEC958)"
feature    = "mux-spdif"
ctor       = "vaco_format_spdif::MUXER"
extensions = "spdif"
