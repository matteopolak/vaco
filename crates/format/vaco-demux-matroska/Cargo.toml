[package]
name = "vaco-demux-matroska"
description = "Matroska/WebM demuxer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-format-core = { path = "../../format/vaco-format-core" }
# The generic RFC 8794 layer — VINTs, the element header, the reader and the
# writer — moved here so a Matroska muxer shares one definition rather than
# duplicating it (D19). See docs/format/vaco-format-ebml.md.
vaco-format-ebml = { path = "../vaco-format-ebml" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-chlayout = { path = "../../model/vaco-chlayout" }
vaco-sampfmt = { path = "../../model/vaco-sampfmt" }
vaco-color = { path = "../../model/vaco-color" }
miniz_oxide.workspace = true

[dev-dependencies]
proptest.workspace = true
divan.workspace = true

[[bench]]
name = "demux"
harness = false

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
