[package]
name = "vaco-mux-flv"
description = "FLV (Flash Video) muxer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-format-core = { path = "../../format/vaco-format-core" }
# The one owner of "is this extradata a configuration record or Annex-B, and
# do the frames need reframing" — `length_prefixed_config`.
vaco-format-nalu = { path = "../vaco-format-nalu" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
# Shares the AMF0 encoder with the demuxer's decoder — one definition of the
# value model and its byte layout rather than two (D19). See
# `docs/format/vaco-mux-flv.md`.
vaco-demux-flv = { path = "../vaco-demux-flv" }

[dev-dependencies]
proptest.workspace = true
vaco-chlayout = { path = "../../model/vaco-chlayout" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
