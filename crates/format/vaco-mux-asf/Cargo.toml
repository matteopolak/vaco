[package]
name = "vaco-mux-asf"
description = "ASF (Advanced Systems Format) muxer: .asf/.wmv/.wma."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-format-asf = { path = "../vaco-format-asf" }
vaco-format-riff = { path = "../vaco-format-riff" }
vaco-format-nalu = { path = "../vaco-format-nalu" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }

[dev-dependencies]
proptest.workspace = true
# Round-trips this crate's own output through its sibling demuxer, mirroring
# `vaco-mux-avi`'s dev-dependency on `vaco-demux-avi` for the same reason.
vaco-demux-asf = { path = "../vaco-demux-asf" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
