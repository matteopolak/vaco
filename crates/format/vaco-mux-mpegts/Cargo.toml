[package]
name = "vaco-mux-mpegts"
description = "MPEG-TS muxer: PAT/PMT/SDT, PES packetisation, PCR, M2TS wrapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-io = { path = "../../io/vaco-io" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-format-mpegts-tables = { path = "../../format/vaco-format-mpegts-tables" }
vaco-format-nalu = { path = "../../format/vaco-format-nalu" }
bitflags = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Round-trips this crate's PES/PSI output through the sibling demuxer's own
# parser — most directly for the 33-bit timestamp encoding, which is the
# single most error-prone field here (see the crate docs). Dev-only: the
# production dependency graph does not include the demuxer.
vaco-demux-mpegts = { path = "../vaco-demux-mpegts" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
