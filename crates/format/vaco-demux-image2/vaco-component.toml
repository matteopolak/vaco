# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# 38 demuxers, one shared feature: `image2` plus the 37 `*_pipe` splitters.
# Names, long names and extensions are captured under `LC_ALL=C` against
# ffmpeg 8.1 (`ffmpeg -demuxers`, `ffmpeg -h demuxer=<name>`) — see
# `docs/format/vaco-demux-image2.md` for the exact commands, the measured
# vs. assumed split, and why the count is 37 pipe splitters, not the
# roadmap's 42.

[[component]]
kind       = "demuxer"
name       = "image2"
long_name  = "image2 sequence"
feature    = "demux-image2"
ctor       = "vaco_demux_image2::DEMUXER_IMAGE2"

[[component]]
kind       = "demuxer"
name       = "bmp_pipe"
long_name  = "piped bmp sequence"
feature    = "demux-image2"
ctor       = "vaco_demux_image2::pipe::DEMUXER_BMP"
