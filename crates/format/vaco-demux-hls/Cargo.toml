[package]
name = "vaco-demux-hls"
description = "HTTP Live Streaming (HLS) demuxer: master/media playlist parsing and segment reading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-io = { path = "../../io/vaco-io" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-format-adaptive = { path = "../../format/vaco-format-adaptive" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
vaco-packet = { path = "../../model/vaco-packet" }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# Dev-only, for the integration test's segment provider: this crate never
# depends on a concrete container demuxer/muxer in production (see
# `vaco_format_adaptive::provider`).
vaco-demux-mpegts = { path = "../../format/vaco-demux-mpegts" }
vaco-mux-mpegts = { path = "../../format/vaco-mux-mpegts" }
# Dev-only, for constructing a `ProtocolRegistry` against real local files in
# tests (rule W2: never a production dependency).
vaco-protocol-file = { path = "../../io/vaco-protocol-file" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
