# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# 48 demuxers, one shared feature: `--features demux-raw` brings the whole
# crate or none of it, the same convention `vaco-parse-aac` uses for its two
# components. Names, long names and extensions are captured under `LC_ALL=C`
# against ffmpeg 8.1 (`ffmpeg -demuxers`, `ffmpeg -h demuxer=<name>`) — see
# `docs/format/vaco-demux-raw.md` for the exact commands and what was
# measured versus assumed per format.

