# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# One muxer. This row registers the degenerate single-sink adapter; the real
# multi-file writer replaces it on the first `Muxer::bind_url` call.
#
# The extension list is the reference's, verbatim and in its order. A muxer
# claiming an extension is independent of whether an encoder for it exists:
# without these, every image extension resolved to a demuxer-only row and the
# CLI reported "reads that format but cannot write it" for output paths it can
# in fact write.

[[component]]
kind       = "muxer"
name       = "image2"
long_name  = "image2 sequence"
feature    = "mux-image2"
ctor       = "vaco_mux_image2::MUXER_IMAGE2"
extensions = "bmp,dpx,exr,jls,jpeg,jpg,jxs,jxl,ljpg,pam,pbm,pcx,pfm,pgm,pgmyuv,phm,png,ppm,sgi,tga,tif,tiff,jp2,j2c,j2k,xwd,sun,ras,rs,im1,im8,im24,sunras,vbn,xbm,xface,pix,y,avif,qoi,hdr,wbmp"
