# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# 40 muxers, one shared feature: `--features mux-raw` brings the whole crate
# or none of it. Names, long names and extensions are captured under
# `LC_ALL=C` against ffmpeg 8.1 (`ffmpeg -muxers`, `ffmpeg -h muxer=<name>`)
# — see `docs/format/vaco-mux-raw.md`. Several long names/extensions differ
# from the matching demuxer in `vaco-demux-raw`'s fragment; that is measured,
# not a typo — see that file's `crate::raw` module docs for the list.

# ---------------------------------------------------------------------- PCM

[[component]]
kind      = "muxer"
name      = "alaw"
long_name = "PCM A-law"
feature   = "mux-raw"
ctor      = "vaco_mux_raw::raw::MUXER_ALAW"
extensions = "al"

