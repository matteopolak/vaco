# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Eight names, one implementation (`vaco_mux_mp4::MovMuxer`) differing only in
# the `Brand` each `open` closure passes to `MovMuxer::with_options` — see
# `src/brand.rs`. `avif` is deliberately absent: `MUXER_AVIF` exists in code
# for documentation (the measured `ftyp` bytes) but always returns
# `Unsupported`, since AVIF is a HEIF item structure, not a `moov`/`trak`
# track mux; registering a name that cannot produce output would only mislead
# `-formats`.
#
# `movflags`, fragmentation thresholds and metadata are not reachable through
# the registry's bare `open: fn(Box<dyn MediaSink>) -> Result<Box<dyn Muxer>>`
# — a caller who needs them constructs `vaco_mux_mp4::MovMuxer::with_options`
# directly, the same gap `vaco-mux-avi`'s own fragment leaves for its options.

[[component]]
kind       = "muxer"
name       = "mp4"
long_name  = "MP4 (MPEG-4 Part 14)"
feature    = "mux-mp4"
ctor       = "vaco_mux_mp4::MUXER_MP4"
extensions = "mp4,m4a,m4v"
mime_types = "video/mp4,audio/mp4,application/mp4"

