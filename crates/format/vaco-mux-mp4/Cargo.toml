[package]
name = "vaco-mux-mp4"
description = "MP4/MOV muxer: progressive and fragmented ISOBMFF, faststart, iTunes metadata, brand variants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-format-isom = { path = "../../format/vaco-format-isom" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
bitflags.workspace = true

[dev-dependencies]
proptest.workspace = true
# Round-trips this crate's own output through its sibling demuxer — the most
# direct way to verify the byte layout is self-consistent, and it reuses
# `vaco-demux-mp4`'s own measured understanding of the format rather than
# re-deriving a second, parallel one just for tests.
vaco-demux-mp4 = { path = "../vaco-demux-mp4" }
# The real `extract_extradata` `check_bitstream` asks for — see
# `vaco-mux-avi`'s identical dependency for why a real filter, not a hand
# test-double.
vaco-bsf-generic = { path = "../vaco-bsf-generic" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
