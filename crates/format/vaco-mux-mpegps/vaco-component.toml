# Registry fragment, per the frozen schema in planning/19-parallel-execution.md
# §3.4. Five muxer profiles, one implementation (`vaco_mux_mpegps::mux::PsMuxer`).

[[component]]
kind       = "muxer"
name       = "mpeg"
long_name  = "MPEG-1 Systems / MPEG program stream"
feature    = "mux-mpeg"
ctor       = "vaco_mux_mpegps::MUXER_MPEG"
extensions = "mpg,mpeg"
mime_types = "video/mpeg"

[[component]]
kind       = "muxer"
name       = "vcd"
long_name  = "MPEG-1 Systems / MPEG program stream (VCD)"
feature    = "mux-vcd"
ctor       = "vaco_mux_mpegps::MUXER_VCD"
extensions = "dat"
mime_types = "video/mpeg"

[[component]]
kind       = "muxer"
name       = "vob"
long_name  = "MPEG-2 PS (VOB)"
feature    = "mux-vob"
ctor       = "vaco_mux_mpegps::MUXER_VOB"
extensions = "vob"
mime_types = "video/mpeg"

[[component]]
kind       = "muxer"
name       = "svcd"
long_name  = "MPEG-2 PS (SVCD)"
feature    = "mux-svcd"
ctor       = "vaco_mux_mpegps::MUXER_SVCD"
extensions = "mpg"
mime_types = "video/mpeg"

[[component]]
kind       = "muxer"
name       = "dvd"
long_name  = "MPEG-2 PS (DVD VOB)"
feature    = "mux-dvd"
ctor       = "vaco_mux_mpegps::MUXER_DVD"
extensions = "vob"
mime_types = "video/mpeg"
