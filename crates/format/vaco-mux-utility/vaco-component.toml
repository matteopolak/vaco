# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Two registrations, issue #572 (FM-20). Names and long names captured under
# `LC_ALL=C` against ffmpeg 8.1 (`ffmpeg -h muxer=<name>`) — see
# `docs/format/vaco-mux-utility.md`. The third name under #572,
# `uncodedframecrc`, is not registered here — see that doc's final section.

[[component]]
kind      = "muxer"
name      = "null"
long_name = "raw null video"
ctor      = "vaco_mux_utility::MUXER_NULL"

[[component]]
kind      = "muxer"
name      = "mkvtimestamp_v2"
long_name = "extract pts as timecode v2 format, as defined by mkvtoolnix"
ctor      = "vaco_mux_utility::MUXER_MKVTIMESTAMP_V2"
