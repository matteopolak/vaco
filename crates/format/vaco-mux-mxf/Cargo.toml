[package]
name = "vaco-mux-mxf"
description = "MXF (Material eXchange Format) muxer: OP1a, KLV/partition/primer/structural-metadata generation, frame-wrapped essence, index tables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-time = { path = "../../core/vaco-time" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }

[dev-dependencies]
proptest.workspace = true
vaco-chlayout = { path = "../../model/vaco-chlayout" }
# Round-trips this crate's own output through its sibling demuxer — the most
# direct way to verify the byte layout is self-consistent, and it reuses
# `vaco-demux-mxf`'s own measured understanding of the format rather than
# re-deriving a second, parallel one just for tests. See `vaco-mux-mp4`'s
# identical dependency for the same reasoning.
vaco-demux-mxf = { path = "../vaco-demux-mxf" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
