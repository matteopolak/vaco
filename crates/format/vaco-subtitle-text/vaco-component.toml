# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Scope note (see `src/lib.rs`): the reference (`ffmpeg 8.1`) names 16 text
# subtitle demuxers and 8 muxers in this family — not the 15/6 a plan once
# counted. `ttml`'s demuxer has no reference counterpart at all (spec-only,
# see `src/ttml.rs`); everything else here was checked against `ffprobe`.
#
# Every demuxer/muxer below now carries the `CodecId` its stream actually
# produces (see `src/lib.rs`'s "CodecId gap" section for the history: eleven
# formats initially had none, since only `vaco-codec-core` may add a variant
# and it was out of this crate's scope; the variants have since landed
# there). This fragment schema has no `codec` key for demuxer/muxer kinds —
# the codec is a runtime fact of the stream, not a static descriptor field —
# so nothing here changes as a result; it is recorded in each module's own
# `DEMUXER`/`MUXER` doc comment instead.

# ------------------------------------------------------------------ demuxers

[[component]]
kind       = "demuxer"
name       = "srt"
long_name  = "SubRip subtitle"
feature    = "subtitle-text"
ctor       = "vaco_subtitle_text::srt::DEMUXER"
media      = "subtitle"
extensions = "srt"
mime_types = "application/x-subrip"

