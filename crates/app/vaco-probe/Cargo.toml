[package]
name = "vaco-probe"
description = "The ffprobe-equivalent binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A library plus a thin binary, rather than a binary alone.
#
# The whole program has to be reachable from a test and from a fuzz target
# without spawning a process: `cargo fuzz` links against a *library*, and D6
# makes `cli_probe` a required target for a crate that parses untrusted argv and
# untrusted media. The binary target keeps only argv, stdio and the exit code.
#
# Having a lib target also brings the crate inside `cargo xtask wasm-check`
# (D18), which it passes: the only OS coupling is `std::fs` behind `vaco-io`,
# and that compiles on wasm and fails gracefully at runtime.
[lib]
name = "vaco_probe"
path = "src/lib.rs"

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-cli-core = { path = "../../app/vaco-cli-core" }
vaco-textformat = { path = "../../app/vaco-textformat" }
vaco-registry = { path = "../../registry/vaco-registry" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
vaco-chlayout = { path = "../../model/vaco-chlayout" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-pixfmt = { path = "../../model/vaco-pixfmt" }
vaco-sampfmt = { path = "../../model/vaco-sampfmt" }
vaco-io = { path = "../../io/vaco-io" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-protocol-file = { path = "../../io/vaco-protocol-file" }

# `-show_data_hash`. This crate used to declare `crc`, `md-5`, `sha1` and `sha2`
# directly and `vaco-mux-hash` declared the same four — a D11 violation that
# `owner-gate` reported. `vaco-hash` is now their single owner.
vaco-hash = { path = "../../core/vaco-hash" }

[dev-dependencies]
proptest.workspace = true
vaco-color = { path = "../../model/vaco-color" }
# `tests/frame_tags.rs` only: builds a `Frame` directly (no decoder involved,
# same "replay the description" split `reference.rs`/`packets.rs` use) to
# prove `show::tags` renders `Frame::metadata()` byte-identically to the
# reference. Not a production dependency — see `FRAMES_UNSUPPORTED` in
# `src/lib.rs` for why `-show_frames` itself stays refused in v0.1.
vaco-frame = { path = "../../model/vaco-frame" }
smallvec.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 7
