[package]
name = "vaco-cli"
description = "The ffmpeg-equivalent binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A library plus a thin binary, rather than a binary alone.
#
# `cargo fuzz` links against a *library*, and D6 makes a fuzz target mandatory
# for a crate that parses untrusted input — and a user's command line is the
# least trusted input in the project. The binary target keeps only argv, stdio
# and the exit code, so a test can run a whole invocation in-process.
#
# Having a lib target also brings the crate inside `cargo xtask wasm-check`
# (D18), which it passes: the only OS coupling is `std::fs` behind `vaco-io`,
# which compiles on wasm and fails gracefully at runtime, and there is no clock.
[lib]
name = "vaco_cli"
path = "src/lib.rs"

[[bin]]
name = "vaco"
path = "src/main.rs"

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-time = { path = "../../core/vaco-time" }
# CL-22: `-force_key_frames expr:...` shares the reference's `AVExpr`
# grammar, which this workspace implements once here rather than per option.
vaco-expr = { path = "../../core/vaco-expr" }
vaco-cli-core = { path = "../../app/vaco-cli-core" }
# CL-27/#230: `-print_graphs*` renders through the same seven writers (plus
# `mermaid`/`mermaidhtml`) `vaco-probe` already drives via this crate's
# `SectionId::GRAPH`/`FILTER` family -- see `print_graphs`'s module doc.
vaco-textformat = { path = "../../app/vaco-textformat" }
vaco-sched = { path = "../../app/vaco-sched" }
vaco-registry = { path = "../../registry/vaco-registry" }
vaco-filter-core = { path = "../../filter/vaco-filter-core" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
vaco-packet = { path = "../../model/vaco-packet" }
# CL-21/#222: `-fps_mode`'s `vfr`/`cfr` nodes are plain `vaco-filter-core`
# filters (`fps_mode.rs`), built and inspected directly rather than through
# `-vf`'s text grammar -- see that module's doc for why -- which needs the
# frame type itself, not just the codec/format layers above it.
vaco-frame = { path = "../../model/vaco-frame" }
vaco-pixfmt = { path = "../../model/vaco-pixfmt" }
vaco-sampfmt = { path = "../../model/vaco-sampfmt" }
vaco-chlayout = { path = "../../model/vaco-chlayout" }
vaco-io = { path = "../../io/vaco-io" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-protocol-file = { path = "../../io/vaco-protocol-file" }
# CL-20/CL-25: `-vf`/`-af`/`-filter_complex`/`-lavfi` need a `FilterRegistry`
# that can instantiate *any* registered filter by name. No such aggregate
# exists in `vaco-registry` (`FilterDesc` carries no `build` fn pointer the
# way `DecoderDesc`/`EncoderDesc`/`MuxerDesc` do — see
# `crate::filterreg`'s module doc). Every filter crate already exports a
# per-family `FilterRegistry` impl for exactly this purpose (the same shape
# `vaco-conformance::registries::REGISTRIES` already composes for its own
# reference-gated option tests), so `crate::filterreg::CliFilterRegistry`
# tries each one in turn. This list is that same reviewed set.
vaco-filter-graph = { path = "../../filter/vaco-filter-graph" }
vaco-filter-aanalysis = { path = "../../filter/vaco-filter-aanalysis" }
vaco-filter-adynamics = { path = "../../filter/vaco-filter-adynamics" }
vaco-filter-aeffects = { path = "../../filter/vaco-filter-aeffects" }
vaco-filter-aeq = { path = "../../filter/vaco-filter-aeq" }
vaco-filter-analysis = { path = "../../filter/vaco-filter-analysis" }
vaco-filter-artistic = { path = "../../filter/vaco-filter-artistic" }
vaco-filter-asource = { path = "../../filter/vaco-filter-asource" }
vaco-filter-audio = { path = "../../filter/vaco-filter-audio" }
vaco-filter-blur = { path = "../../filter/vaco-filter-blur" }
vaco-filter-color = { path = "../../filter/vaco-filter-color" }
vaco-filter-convolve = { path = "../../filter/vaco-filter-convolve" }
vaco-filter-deinterlace = { path = "../../filter/vaco-filter-deinterlace" }
vaco-filter-denoise = { path = "../../filter/vaco-filter-denoise" }
vaco-filter-draw-vf = { path = "../../filter/vaco-filter-draw-vf" }
vaco-filter-geometry = { path = "../../filter/vaco-filter-geometry" }
vaco-filter-key = { path = "../../filter/vaco-filter-key" }
vaco-filter-lut = { path = "../../filter/vaco-filter-lut" }
vaco-filter-mm = { path = "../../filter/vaco-filter-mm" }
vaco-filter-motion = { path = "../../filter/vaco-filter-motion" }
vaco-filter-overlay = { path = "../../filter/vaco-filter-overlay" }
vaco-filter-palette = { path = "../../filter/vaco-filter-palette" }
vaco-filter-scope = { path = "../../filter/vaco-filter-scope" }
vaco-filter-source = { path = "../../filter/vaco-filter-source" }
vaco-filter-stack = { path = "../../filter/vaco-filter-stack" }
vaco-filter-subtitle = { path = "../../filter/vaco-filter-subtitle" }
vaco-filter-temporal = { path = "../../filter/vaco-filter-temporal" }
vaco-filter-text = { path = "../../filter/vaco-filter-text" }
vaco-filter-v360 = { path = "../../filter/vaco-filter-v360" }
vaco-filter-video-composite = { path = "../../filter/vaco-filter-video-composite" }
vaco-filter-video-format = { path = "../../filter/vaco-filter-video-format" }
vaco-filter-video-geometry = { path = "../../filter/vaco-filter-video-geometry" }
vaco-filter-video-source = { path = "../../filter/vaco-filter-video-source" }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# A fixture builder, not a muxer: `synth` writes exactly what it is told,
# including a per-track `FlagDefault`, which is the field the whole
# auto-selection rule turns on and which no real muxer will let a test control.
# A dev-dependency on a layer-4 crate from layer 7 points downward, so
# `layer-check` is satisfied; nothing in the shipped binary reaches it.
vaco-demux-matroska = { path = "../../format/vaco-demux-matroska" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 7
