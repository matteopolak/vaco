[package]
name = "vaco-cli"
description = "The ffmpeg-equivalent binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A library plus a thin binary, rather than a binary alone.
#
# `cargo fuzz` links against a *library*, and D6 makes a fuzz target mandatory
# for a crate that parses untrusted input — and a user's command line is the
# least trusted input in the project. The binary target keeps only argv, stdio
# and the exit code, so a test can run a whole invocation in-process.
#
# Having a lib target also brings the crate inside `cargo xtask wasm-check`
# (D18), which it passes: the only OS coupling is `std::fs` behind `vaco-io`,
# which compiles on wasm and fails gracefully at runtime, and there is no clock.
[lib]
name = "vaco_cli"
path = "src/lib.rs"

[[bin]]
name = "vaco"
path = "src/main.rs"

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-time = { path = "../../core/vaco-time" }
# CL-22: `-force_key_frames expr:...` shares the reference's `AVExpr`
# grammar, which this workspace implements once here rather than per option.
vaco-expr = { path = "../../core/vaco-expr" }
vaco-cli-core = { path = "../../app/vaco-cli-core" }
# CL-27/#230: `-print_graphs*` renders through the same seven writers (plus
# `mermaid`/`mermaidhtml`) `vaco-probe` already drives via this crate's
# `SectionId::GRAPH`/`FILTER` family -- see `print_graphs`'s module doc.
vaco-textformat = { path = "../../app/vaco-textformat" }
vaco-sched = { path = "../../app/vaco-sched" }
vaco-registry = { path = "../../registry/vaco-registry" }
vaco-filter-core = { path = "../../filter/vaco-filter-core" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
vaco-packet = { path = "../../model/vaco-packet" }
# CL-21/#222: `-fps_mode`'s `vfr`/`cfr` nodes are plain `vaco-filter-core`
# filters (`fps_mode.rs`), built and inspected directly rather than through
# `-vf`'s text grammar -- see that module's doc for why -- which needs the
# frame type itself, not just the codec/format layers above it.
vaco-frame = { path = "../../model/vaco-frame" }
vaco-pixfmt = { path = "../../model/vaco-pixfmt" }
vaco-sampfmt = { path = "../../model/vaco-sampfmt" }
vaco-chlayout = { path = "../../model/vaco-chlayout" }
vaco-io = { path = "../../io/vaco-io" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-protocol-file = { path = "../../io/vaco-protocol-file" }
# CL-20/CL-25: `-vf`/`-af`/`-filter_complex`/`-lavfi` resolve filter names
# through `vaco_registry::Filters`, generated from every filter crate's own
# `filter_dispatch` component (GitHub #497 fixed this: a hand-maintained
# list of every filter crate here used to back it, and it silently drifted
# from `vaco-registry`'s own `FILTERS` table). `vaco-filter-video-format` is
# still named directly below because `fps_mode.rs` builds its `vfr`/`cfr`
# nodes straight from that crate's types rather than through `-vf`'s text
# grammar; no other single filter crate needs naming here any more.
vaco-filter-graph = { path = "../../filter/vaco-filter-graph" }
vaco-filter-video-format = { path = "../../filter/vaco-filter-video-format" }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# A fixture builder, not a muxer: `synth` writes exactly what it is told,
# including a per-track `FlagDefault`, which is the field the whole
# auto-selection rule turns on and which no real muxer will let a test control.
# A dev-dependency on a layer-4 crate from layer 7 points downward, so
# `layer-check` is satisfied; nothing in the shipped binary reaches it.
vaco-demux-matroska = { path = "../../format/vaco-demux-matroska" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 7
