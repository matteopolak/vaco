[package]
name = "vaco-registry"
description = "Generated assembly of enabled components."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
# `Parsers` carries the `Limits` it builds parsers with: `ParserProvider::
# parser_for` takes none, and a parser on the probe path reads attacker bytes.
vaco-limits = { path = "../../core/vaco-limits" }
vaco-format-core = { path = "../../format/vaco-format-core" }
vaco-filter-core = { path = "../../filter/vaco-filter-core" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
# `Bsfs` names `vaco_bsf_core::BsfDesc`, the type every `vaco-bsf-*` crate's
# `filters()` returns — same shape as the `vaco-codec-core` dependency above,
# needed for a type name rather than for a generated table (`kind =
# "bitstream_filter"` has no typed table yet; see `Bsfs`'s own doc comment).
vaco-bsf-core = { path = "../../format/vaco-bsf-core" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 6

# BEGIN GENERATED — `cargo xtask gen-registry`. Do not edit by hand.
#
# One optional path dependency per component crate, and one feature per
# `feature = …` a fragment names. `default` lists every feature that did not
# opt out with `default = false`, so a component can never be silently absent
# from a default build — the same rule `gen-fuzz` applies to its targets.
