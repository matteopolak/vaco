# The `jctvc` suite's gap row (H.264/HEVC, "no stable anonymous mirror") was
# removed 2026-09-01 — resolved, see the header comment's CORRECTION. Its
# real entries, and `jvt-h264`'s, follow below.

# jvt-h264 / jctvc — added 2026-09-01. A curated, deliberately partial subset
# of each suite chosen to maximise construct coverage per byte downloaded
# rather than to approach either suite's full size (JVT's AVCv1+FRExt
# directories alone are >1.5 GiB; JCT-VC's HEVC_v1 is smaller but still far
# larger than what is registered here). ~37 MiB total across 65 zips.
#
# jvt-h264 (19 entries, AVCv1 + 2 small FRExt streams): baseline CAVLC/CABAC,
# per-slice QP variation, multiple reference frames, no-long-term-reference,
# access unit delimiters, field/frame coding switch, I_PCM macroblocks,
# flexible macroblock ordering (slice groups), and two High-profile/8x8-
# transform (FRExt) streams. Left out for size: every High-profile stream
# with a companion reference YUV over ~2 MiB, the professional-profiles,
# MVC and SVC extension directories entirely (out of this project's current
# H.264 decoder scope), and every field/MBAFF stream whose zip exceeds a few
# MiB (`cavlc_mot_*_full*.zip`, `Sharp_MP_*`) — MBAFF coverage here is
# therefore field/frame-switching only (`CVFI1_SVA_C`), not true MBAFF.
#
# jctvc (49 entries, HEVC_v1): I_PCM, constrained intra prediction, merge/
# parallel-merge, AMVP, deblocking, parameter-set edge cases (PS/VPSID/
# VPSSPSPPS/CONFWIN), SAO, temporal scalability, motion-vector edge/clipping,
# slices, residual quad-tree (RQT), reference picture sets/lists (RPS/RPLM),
# POC, picture size changes, random-access/no-output-prior pictures, HRD,
# entropy-coding edge cases (ENTP/MAXBINS — not registered, see below),
# intra prediction, filler data, NAL unit type edge cases, and structural
# edge cases (STRUCT/SLIST). Left out for size: every stream over ~350 KiB
# (weighted prediction `WP_*`, wavefront parallel processing `WPP_*`, CABAC
# initialisation `CAINIT_*`, tiles `TILES_*`, transform skip `TSKIP_*`,
# 10-bit `Main10`/`TSUNEQBD_*`, delta-QP `DELTAQP_*`, long-term RPS
# `LTRPSPS_*`, bumping/DPB `BUMPING_*`, adaptive MV prediction `AMP_{B,D,E,F}`
# beyond the one `AMP_A` registered) — so **tiles, WPP, explicit weighted
# prediction, 10-bit, and CABAC-initialisation-table stress cases are not
# covered by this subset** even though the HEVC decoder may implement some
# of them. `RExt`/`SCC`/`SHVC`/`MV-HEVC`/`3D-HEVC` (range extensions,
# screen content, scalable/multiview/3D) are separate JCT-VC directories not
# touched at all — out of scope for a HEVC v1 (Main/Main10) conformance pass.
# WPP_D, WPP_E, and WPP_F below are the bounded exceptions to the omitted WPP
# family.


# ------------------------------------------------- jvt-h264 (AVCv1/FRExt)

