# vaco-media.lock — content-addressed conformance/fuzz corpus inventory.
#
# GENERATED BY HAND for the initial set (2026-08-28); not GENERATED-with-a-tool
# in the sense the manifest-trap table in AGENT-CONSTRAINTS.md warns about —
# editing this file directly is fine, `vaco_corpus::lock::MediaLock` just
# parses/renders it.
#
# Every url+sha256 pair below was probed live on 2026-08-28: fetched over
# HTTPS/HTTP from the canonical upstream, hashed, and recorded. `size` is the
# byte count observed at fetch time, as an independent sanity check ahead of
# the hash. `cargo test -p vaco-corpus` does NOT re-fetch these (no test
# depends on the network) — see `tests/fetch_local_server.rs` for the
# network-touching logic, which is exercised only against a loopback server.
#
# Disk budget: the original ten entries name ~207 KiB across 10 files. The
# `jvt-h264`/`jctvc` sections added 2026-09-01 add a further ~37 MiB across 65
# files, deliberately a representative subset rather than a full mirror of
# either suite — see that section's own header comment for exactly what was
# left out and why. `vaco_corpus::fetch::fetch` only downloads an entry the
# first time something asks for it by name, and only when
# VACO_CORPUS_NETWORK=1 — nothing here is fetched eagerly, including by CI.
#
# CORRECTION (2026-09-01): the paragraph below, written 2026-08-28, claimed
# JVT/JCT-VC conformance bitstreams have no stable anonymous URL. That was
# wrong — checked, not merely re-asserted (AGENT-CONSTRAINTS's "check a
# recorded blocker before you accept it"): `https://www.itu.int/wftp3/av-arch/
# jvt-site/draft_conformance/` and its JCT-VC equivalent under
# `jctvc-site/bitstream_exchange/` serve a plain Apache directory listing over
# HTTPS with no authentication, no registration and no cookie, and every file
# in it is individually fetchable by URL. The H.264 side is in fact the
# published electronic attachment to ITU-T Rec. H.264.1 (2010) — this
# session cross-checked every downloaded AVCv1/FRExt zip's whole-file CRC32
# against that Recommendation's own published file listing
# (`00readme_H.264.1(2010).html` in the same directory) and all matched
# exactly. See the `jvt-h264`/`jctvc` sections below for the resolved entries.
# Argon remains an open gap (see its own row) — the wftp3 mirror does not
# cover AV1, and no equivalent anonymous source was found for it this session.
#
# One suite named in the work packages (Argon AV1 streams) still has NO
# fetchable entries below:
#   - Argon streams are distributed under an arrangement with Argon Design
#     Ltd rather than as a plain public bucket/repo of individual files.
# This is a named, documented gap (see AGENT-CONSTRAINTS's "ship when
# demonstrably not broken... say what the deviation is"), not a silent one.
# `suites.toml` in `vaco-conformance` marks `argon` `status = "gap"` with the
# same note. Revisit if a stable public mirror surfaces.

