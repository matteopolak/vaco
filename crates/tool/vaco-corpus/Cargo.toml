[package]
name = "vaco-corpus"
description = "Content-addressed conformance-corpus fetching, storage, mutation and minimisation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "vaco_corpus"
path = "src/lib.rs"

[[bin]]
name = "vaco-corpus"
path = "src/main.rs"

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-hash = { path = "../../core/vaco-hash" }
vaco-io = { path = "../../io/vaco-io" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-protocol-http = { path = "../../io/vaco-protocol-http" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 10
