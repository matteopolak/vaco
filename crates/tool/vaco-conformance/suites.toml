# Codec conformance-suite catalogue (work package QA-09, #181).
#
# Joined against `vaco-corpus`'s `vaco-media.lock` by matching `name` here to
# that file's `[[entry]].suite` — see `vaco_conformance::suites::resolve`.
# `mode` names a plan 13 §1.2 comparison mode as a hint for whoever authors
# the case, not a fully constructed `Compare` value.

schema = 1

[[suite]]
name = "pngsuite"
codec = "png"
mode = "raw-exact"
note = "lossless: PNG decode must be byte-exact per plan 13 §1.11.1"

[[suite]]
name = "vp8-test-vectors"
codec = "vp8"
mode = "raw-exact"
note = "VP8 decode is a lossy integer-defined codec: C4 raw-exact, zero tolerance, per plan 13 §1.11.1"

[[suite]]
name = "vp9-test-vectors"
codec = "vp9"
mode = "raw-exact"
note = "same reasoning as vp8-test-vectors"

[[suite]]
name = "flac-test-files"
codec = "flac"
mode = "raw-exact"
note = "lossless: FLAC decode must be byte-exact per plan 13 §1.11.1"

[[suite]]
name = "argon"
codec = "av1"
mode = "raw-exact"
note = "documented gap: no fetchable entries yet, see vaco-corpus's vaco-media.lock header"

[[suite]]
name = "jvt-h264"
codec = "h264"
mode = "raw-exact"
note = "JVT/AVCv1+FRExt conformance bitstreams (ITU wftp3 av-arch); 19-entry curated subset, differential against ffmpeg's own H.264 decode per D6 -- see tests/conformance/transcode/h264-jvt-conformance.toml and vaco-media.lock's jvt-h264 section header for exactly what was left out"

[[suite]]
name = "jctvc"
codec = "hevc"
mode = "raw-exact"
note = "JCT-VC HEVC_v1 conformance bitstreams (ITU wftp3 av-arch); 46-entry curated subset, differential against ffmpeg's own HEVC decode per D6 -- see tests/conformance/transcode/hevc-jctvc-conformance.toml and vaco-media.lock's jctvc section header for exactly what was left out"
