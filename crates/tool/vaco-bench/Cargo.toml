[package]
name = "vaco-bench"
description = "Registry-complete benchmarks and regression tracking for Vaco."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "vaco_bench"
path = "src/lib.rs"

[dependencies]
vaco-filter-graph = { path = "../../filter/vaco-filter-graph" }
vaco-registry = { path = "../../registry/vaco-registry", default-features = false }

[dev-dependencies]
divan.workspace = true

[[bin]]
name = "vaco-bench"
path = "src/main.rs"

[[bench]]
name = "filters"
harness = false

[lints]
workspace = true

[package.metadata.vaco]
layer = 10
