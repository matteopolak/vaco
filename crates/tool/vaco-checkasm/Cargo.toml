[package]
name = "vaco-checkasm"
description = "Verifies every SIMD kernel against its scalar reference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "vaco_checkasm"
path = "src/lib.rs"

[[bin]]
name = "vaco-checkasm"
path = "src/main.rs"

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-simd = { path = "../../core/vaco-simd" }
# The wired-in demonstration kernel (`src/kernels`): a real, shipped SIMD
# family, not a toy. See that module's doc for why `vaco-scale` was picked.
vaco-scale = { path = "../../signal/vaco-scale" }
vaco-color = { path = "../../model/vaco-color" }
vaco-pixfmt = { path = "../../model/vaco-pixfmt" }
# The separable-FIR motion-compensation kernel (D-08a, #23): wired here for
# the same reason as `vaco-scale` above -- a tool crate (layer 10) may depend
# on anything downward, which is what lets a real production kernel be
# checked without that kernel's own crate depending on this one.
vaco-codec-dsp-mc = { path = "../../signal/vaco-codec-dsp-mc" }
# Motion-estimation comparison kernels (D-12, #144): same reasoning as
# vaco-codec-dsp-mc above.
vaco-codec-dsp-mecmp = { path = "../../signal/vaco-codec-dsp-mecmp" }
# Format-conversion, LPC, blockdsp/pixblockdsp and intra-prediction SIMD
# kernels (D-05/D-07/D-11/D-09): same layer-10-may-depend-downward reasoning
# as vaco-codec-dsp-mc above.
vaco-codec-dsp-fmtconvert = { path = "../../signal/vaco-codec-dsp-fmtconvert" }
vaco-codec-dsp-lpc = { path = "../../signal/vaco-codec-dsp-lpc" }
vaco-codec-dsp-idct = { path = "../../signal/vaco-codec-dsp-idct" }
vaco-codec-dsp-intrapred = { path = "../../signal/vaco-codec-dsp-intrapred" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 10
