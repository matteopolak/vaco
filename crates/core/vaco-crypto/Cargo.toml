[package]
name = "vaco-crypto"
description = "Symmetric ciphers, MACs, and key derivation behind one door: the single owner of aes, ctr, hmac and pbkdf2 (D11). Owns AES-CTR, PBKDF2-HMAC-SHA256, and HMAC-SHA1 (raw, untruncated)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../vaco-core" }
vaco-hash = { path = "../vaco-hash" }

# D11: these four are reachable from this crate and nowhere else.
# `vaco-protocol-crypto`'s AES-128-CBC and `vaco-protocol-rist`'s PSK
# encryption (AES-CTR + PBKDF2-HMAC-SHA256) are its two consumers — the
# threshold that makes owning this cluster load-bearing rather than
# speculative, the same shape as `vaco-hash`'s own extraction.
aes    = { workspace = true }
ctr    = { workspace = true }
hmac   = { workspace = true }
pbkdf2 = { workspace = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 0
