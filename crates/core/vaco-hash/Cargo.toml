[package]
name = "vaco-hash"
description = "Checksums and digests behind one door: the single owner of crc, md-5, sha1 and sha2 (D11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../vaco-core" }

# D11: these four are reachable from this crate and nowhere else. `vaco-probe`
# and `vaco-mux-hash` both used to declare them directly, which `owner-gate`
# reported — and which mattered because in both of those the checksum IS the
# printed output, so two implementations disagreeing by a seed is a byte-level
# divergence from the reference by definition.
crc.workspace = true
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 0
