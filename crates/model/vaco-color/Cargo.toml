[package]
name = "vaco-color"
description = "Colour primaries, transfer, matrix, range per ITU-T H.273."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# No dependencies, and that is a fact about the layering rather than an
# omission. This crate is pure H.273 vocabulary and the arithmetic it implies:
# every entry point returns `Option` rather than `vaco_core::Error`, because it
# sits on the scaler's hot path and `Error::Option` allocates two `String`s.
# The option layer above translates a `None` into a diagnostic.
[dependencies]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 1
