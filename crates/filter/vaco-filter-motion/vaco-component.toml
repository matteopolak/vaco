# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Two of plan 16 §4.2's `vaco-filter-motion` row's four filters
# (`mestimate`, `minterpolate` not attempted — see `src/lib.rs`'s doc).

[[component]]
kind = "filter"
name = "framerate"
long_name = "Upsamples or downsamples progressive source between specified frame rates."
ctor = "vaco_filter_motion::framerate::DESC"
media = "video"

[[component]]
kind = "filter"
name = "deshake"
long_name = "Stabilize shaky video."
ctor = "vaco_filter_motion::deshake::DESC"
media = "video"

[[component]]
kind = "filter"
name = "stabdetect"
long_name = "Analyze video stabilization/deshaking (pass 1 of 2; vaco's own transform-file format, not .trf-compatible)."
ctor = "vaco_filter_motion::stabdetect::DESC"
media = "video"

[[component]]
kind = "filter"
name = "stabtransform"
long_name = "Video stabilization/deshaking (pass 2 of 2; vaco's own transform-file format, not .trf-compatible)."
ctor = "vaco_filter_motion::stabtransform::DESC"
media = "video"

[[component]]
kind = "filter_dispatch"
name = "vaco-filter-motion"
ctor = "vaco_filter_motion::MotionRegistry"
