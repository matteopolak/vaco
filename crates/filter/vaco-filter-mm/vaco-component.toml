# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Twenty of the 24 T1 plumbing/sources/sinks/cutting filters FT-4.3 (GitHub
# #467) names. `buffer`/`abuffer`/`buffersink`/`abuffersink` are not
# registered here — see this crate's `lib.rs` doc for why: they already exist
# as `vaco-filter-core`'s own privileged Graph I/O API, not as leaf filters.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_mm::registry::PlumbingRegistry`,
# a `vaco_filter_graph::registry::FilterRegistry` impl.

