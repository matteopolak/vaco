# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Nine of the twelve T3 measurement/visualisation video filters
# `planning/16-filters.md` §4.2 assigns to `vaco-filter-scope` (counting
# `graphmonitor`/`agraphmonitor` and `drawgraph`/`adrawgraph` as one pair
# each). See `docs/filter/vaco-filter-scope.md` for the rest, left as a
# follow-up or excluded, each for its own recorded reason.
#
# 2026-08-28: this fragment had fallen behind the crate — `datascope`,
# `thistogram`, `graphmonitor`/`agraphmonitor`, `pixscope`, `drawgraph`/
# `adrawgraph` and `vectorscope` were all implemented, tested and shipped
# in earlier passes but never added here, so `cargo xtask gen-registry`
# never made them reachable outside this crate's own `ScopeRegistry` —
# found while checking whether `drawgraph` needed the same treatment.
# `generated.rs` itself is left for the coordinator's own regeneration
# sweep (a shared, generated file); this fragment is the source of truth
# it reads from.

[[component]]
kind = "filter"
name = "histogram"
long_name = "Compute and draw a histogram."
ctor = "vaco_filter_scope::histogram::DESC"
media = "video"

[[component]]
kind = "filter"
name = "waveform"
long_name = "Video waveform monitor."
ctor = "vaco_filter_scope::waveform::DESC"
media = "video"

[[component]]
