# Registry fragment (plan 19 SS3.4). Consumed by `cargo xtask gen-registry`.
#
# T2/T3 video analysis and detection filters, FT-4.9. The registered
# components are the clean, reachable subset of the plan row; the remaining
# named refusals are documented in `vaco_filter_analysis`'s crate-root docs.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_analysis::registry::AnalysisRegistry`,
# a `vaco_filter_graph::registry::FilterRegistry` impl — the same shape
# `vaco-filter-temporal` and `vaco-filter-denoise` use.

[[component]]
kind = "filter"
name = "bbox"
long_name = "Compute bounding box for each frame."
ctor = "vaco_filter_analysis::bbox::DESC"
media = "video"

