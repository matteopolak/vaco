[package]
name = "vaco-filter-analysis"
description = "T2/T3 video measurement filters: psnr, ssim, identity, msad, signalstats, blackdetect, blackframe, bbox, entropy, cropdetect, showinfo, scdet. Plan 16 SS4.3. Most filters here only measure and write their answer to Frame::metadata() (interface gap 11); showinfo writes to Frame's log-only channel instead (interface gap 13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

