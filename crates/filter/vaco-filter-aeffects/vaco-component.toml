# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# FT-4.13d (GitHub #484). All twenty-two filters this crate implements from
# plan 16 §4.3's `vaco-filter-aeffects` row: the seven from FT-4.13b (GitHub
# #482, back when this crate was named `vaco-filter-achannel`) plus fifteen
# landed here. `headphone`, `surround` and `hdcd` are the row's three
# unimplemented names; see this crate's `lib.rs` doc for why. Each `ctor`
# names the per-filter `pub const DESC: FilterDesc`, matching
# `vaco-filter-aeq`'s and `vaco-filter-adynamics`'s convention.

