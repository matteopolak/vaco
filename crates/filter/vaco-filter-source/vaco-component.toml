# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Video test-pattern and procedural generator sources: plan 16 §4.3's
# `vaco-filter-source` row, FT-4.12a (GitHub #474). `nullsrc`/`color`/
# `nullsink` are not registered here (already `vaco-filter-plumbing`), and
# `pal100bars`/`pal75bars` are not registered here (already
# `vaco-filter-video-source`) — see this crate's `lib.rs` doc.  `testsrc`
# and `testsrc2` are not implemented at all — see that same doc for why.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_source::registry::GeneratorRegistry`,
# a `vaco_filter_graph::registry::FilterRegistry` impl.

