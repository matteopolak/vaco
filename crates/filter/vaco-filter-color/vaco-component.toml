# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Colour/LUT video filters, plan 16 §4.2's `vaco-filter-color` row.
# Implemented: colorchannelmixer, lut, lutrgb, lutyuv, lut2, pseudocolor,
# colorlevels, hue, exposure. The rest of the row (curves, colorbalance,
# colorcontrast, colorcorrect, colorize, colortemperature, huesaturation,
# vibrance, selectivecolor, grayworld, greyedge, normalize, monochrome,
# midequalizer, geq, colormap, limitdiff, tonemap, eq, histeq, colormatrix)
# is not registered here — see `vaco_filter_color`'s crate-level doc for
# what stopped colorbalance/grayworld specifically.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_color::registry::ColorRegistry`,
# a `vaco_filter_graph::registry::FilterRegistry` impl.

[[component]]
kind = "filter"
name = "colorchannelmixer"
long_name = "Adjust colors by mixing color channels"
ctor = "vaco_filter_color::colorchannelmixer::DESC"
media = "video"

[[component]]
kind = "filter"
name = "lut"
long_name = "Compute and apply a lookup table to the RGB/YUV input video"
ctor = "vaco_filter_color::lut::lut::DESC"
media = "video"

[[component]]
kind = "filter"
name = "lutrgb"
long_name = "Compute and apply a lookup table to the RGB input video"
ctor = "vaco_filter_color::lut::lutrgb::DESC"
media = "video"

[[component]]
kind = "filter"
name = "lutyuv"
long_name = "Compute and apply a lookup table to the YUV input video"
ctor = "vaco_filter_color::lut::lutyuv::DESC"
media = "video"

[[component]]
kind = "filter"
name = "lut2"
long_name = "Compute and apply a lookup table from two video inputs"
ctor = "vaco_filter_color::lut2::DESC"
media = "video"

[[component]]
kind = "filter"
name = "pseudocolor"
long_name = "Make pseudocolored video frames"
ctor = "vaco_filter_color::pseudocolor::DESC"
media = "video"

[[component]]
kind = "filter"
name = "colorlevels"
long_name = "Adjust the color levels"
ctor = "vaco_filter_color::colorlevels::DESC"
media = "video"

[[component]]
kind = "filter"
name = "hue"
long_name = "Adjust the hue and saturation of the input video."
ctor = "vaco_filter_color::hue::DESC"
media = "video"

[[component]]
kind = "filter"
name = "exposure"
long_name = "Adjust exposure of the video stream"
ctor = "vaco_filter_color::exposure::DESC"
media = "video"

[[component]]
kind = "filter"
name = "colormatrix"
long_name = "Convert color matrix"
ctor = "vaco_filter_color::colormatrix::DESC"
media = "video"

[[component]]
kind = "filter"
name = "limitdiff"
long_name = "Apply filtering with limiting difference"
ctor = "vaco_filter_color::limitdiff::DESC"
media = "video"

[[component]]
kind = "filter_dispatch"
name = "vaco-filter-color"
ctor = "vaco_filter_color::ColorRegistry"
