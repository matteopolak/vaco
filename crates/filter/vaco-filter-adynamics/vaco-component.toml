# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Fourteen T2 audio dynamics filters (FT-4.8b, GitHub #472): the
# compressor/limiter/gate/expander/sidechain family plus loudness
# normalisation and measurement. Each `ctor` names the per-filter
# `pub const DESC: FilterDesc`, matching `vaco-filter-audio`'s convention.

[[component]]
kind = "filter"
name = "acompressor"
long_name = "Audio compressor"
ctor = "vaco_filter_adynamics::acompressor::DESC"
media = "audio"

[[component]]
kind = "filter"
name = "acrusher"
long_name = "Reduce audio bit resolution"
ctor = "vaco_filter_adynamics::acrusher::DESC"
