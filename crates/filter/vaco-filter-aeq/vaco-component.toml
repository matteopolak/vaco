# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Fifteen T2 audio EQ filters (FT-4.8a, GitHub #471): the twelve-filter
# biquad family from one file (`equalizer`, `bass`, `lowshelf`, `treble`,
# `highshelf`, `tiltshelf`, `highpass`, `lowpass`, `bandpass`, `bandreject`,
# `allpass`, `biquad`) plus `anequalizer`, `firequalizer`, `superequalizer`.
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`, matching
# `vaco-filter-audio`'s convention exactly.

[[component]]
kind = "filter"
name = "allpass"
long_name = "Apply a two-pole all-pass filter"
ctor = "vaco_filter_aeq::allpass::DESC"
media = "audio"

[[component]]
kind = "filter"
name = "anequalizer"
long_name = "Apply high-order audio parametric multi band equalizer"
ctor = "vaco_filter_aeq::anequalizer::DESC"
media = "audio"

