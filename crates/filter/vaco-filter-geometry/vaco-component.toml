# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# T2 geometry filters, GitHub issue #470 (FT-4.7). Membership is
# `planning/16-filters.md` §4.3's `vaco-filter-geometry` row minus what is
# already registered elsewhere — see this crate's `lib.rs` doc for the full
# accounting. `crop`, `pad`, `transpose`, `hflip`, `vflip` are
# `vaco-filter-video-geometry`'s T1 set; `rotate` is
# `vaco-filter-video-composite`'s (issue #465) — both discovered as overlaps
# via `gen-registry`'s dup-check rather than any plan doc, and neither is
# registered here.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_geometry::registry::T2GeometryRegistry`,
# a `vaco_filter_graph::registry::FilterRegistry` impl.

