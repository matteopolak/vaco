# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Audio test-signal and FIR-coefficient generator sources: plan 16 §4.3's
# `vaco-filter-asource` row, FT-4.13a (GitHub #481). `anullsrc`/`anullsink`
# are not registered here (already `vaco-filter-plumbing`), and
# `afirsrc`/`afireqsrc` are not implemented at all — see this crate's
# `lib.rs` doc.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_asource::registry::AsourceRegistry`,
# a `vaco_filter_graph::registry::FilterRegistry` impl.

