# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Eleven T3 audio analysis and measurement filters (FT-4.13c, GitHub #483).
# Plan 16 §4.3's `vaco-filter-aanalysis` row names fourteen; `astats` and
# `silencedetect` are excluded because `vaco-filter-adynamics` already
# registers both, and `axcorrelate` because `vaco-filter-achannel`
# (FT-4.13b, GitHub #482, landed first) already registers it — a genuine
# two-issue overlap (see `src/lib.rs` and
# `docs/filter/vaco-filter-ameasure.md` for the full reconciliation,
# including where GitHub #483's own suggested list was wrong in other
# ways). Each `ctor` names the per-filter `pub const DESC: FilterDesc`,
# matching every sibling audio crate's convention.

[[component]]
kind = "filter"
name = "aderivative"
long_name = "Compute derivative of input audio"
ctor = "vaco_filter_ameasure::aderivative::DESC"
media = "audio"

