# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# T2/T3 field-order and deinterlace filters, FT-4.12 long tail (#480, no
# dedicated issue): yadif, bwdif, w3fdif, estdif, separatefields, weave,
# doubleweave, fieldorder, fieldmatch, fieldhint, detelecine, telecine,
# idet, vfrdet, interlace, tinterlace, kerndeint, pullup, repeatfields,
# phase. Every name checked against `ffmpeg -hide_banner -filters` and
# `ffmpeg -h filter=<name>` (ffmpeg 8.1, 2026-08-23) — see
# `vaco_filter_deinterlace`'s crate-root doc for the full accounting.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_deinterlace::registry::
# DeinterlaceRegistry`, a `vaco_filter_graph::registry::FilterRegistry`
# impl — the same shape `vaco-filter-temporal` and `vaco-filter-denoise` use.

[[component]]
kind = "filter"
name = "yadif"
long_name = "Deinterlace the input image."
ctor = "vaco_filter_deinterlace::yadif::DESC"
media = "video"

