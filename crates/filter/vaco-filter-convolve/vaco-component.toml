# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Twelve of the eighteen T2/T3 convolution and morphology video filters
# `planning/16-filters.md` §4.2 assigns to `vaco-filter-convolve`, split out
# of `vaco-filter-blur` (GitHub issue #468) after the crate boundary was
# corrected against that table. See `docs/filter/vaco-filter-convolve.md`
# for the six filters this crate leaves for a follow-up.

