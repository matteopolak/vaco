# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Four of the eleven T2 blur/sharpen video filters `planning/16-filters.md`
# §4.2 assigns to this crate (GitHub issue #468). `convolution`, `sobel`,
# `prewitt`, `roberts`, `scharr`, `kirsch`, `dilation`, `erosion`, `median`
# moved to `vaco-filter-convolve` after the crate boundary was corrected
# against that table. See `docs/filter/vaco-filter-blur.md` for the seven
# filters (`cas`, `dblur`, `guided`, `sab`, `smartblur`, `varblur`,
# `yaepblur`) this crate leaves for a follow-up.

[[component]]
kind = "filter"
name = "avgblur"
long_name = "Apply Average Blur filter"
ctor = "vaco_filter_blur::avgblur::DESC"
media = "video"

[[component]]
kind = "filter"
name = "boxblur"
long_name = "Blur the input"
ctor = "vaco_filter_blur::boxblur::DESC"
media = "video"

[[component]]
kind = "filter"
name = "gblur"
long_name = "Apply Gaussian Blur filter"
ctor = "vaco_filter_blur::gblur::DESC"
media = "video"

[[component]]
kind = "filter"
name = "unsharp"
long_name = "Sharpen or blur the input video"
ctor = "vaco_filter_blur::unsharp::DESC"
media = "video"
