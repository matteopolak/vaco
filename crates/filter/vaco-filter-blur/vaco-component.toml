# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# FT-4.6a (GitHub #468): fourteen T2 blur/sharpen/convolution video filters.
# The reference's real membership for this group was measured directly
# (`ffmpeg -filters`, `ffmpeg -h filter=<name>`) rather than trusted from the
# brief; see `docs/filter/vaco-filter-blur.md` for the full list of filters
# this crate leaves for a follow-up.

