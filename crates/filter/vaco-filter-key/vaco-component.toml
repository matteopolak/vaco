# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Keying/masking video filters, plan 16 §4.2's `vaco-filter-key` row.
# Implemented: premultiply, unpremultiply, maskedmerge, colorkey,
# colorhold, maskedclamp, maskedmax, maskedmin, maskedthreshold,
# threshold. The rest of the row (chromakey, chromahold, hsvkey, hsvhold,
# lumakey, backgroundkey, despill, premultiply_dynamic, maskfun,
# hysteresis, floodfill) is not registered here — see
# `vaco_filter_key`'s crate-level doc for why each one is left.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_key::registry::KeyRegistry`, a
# `vaco_filter_graph::registry::FilterRegistry` impl.

[[component]]
kind = "filter"
name = "premultiply"
long_name = "PreMultiply first stream with first plane of second stream"
ctor = "vaco_filter_key::premultiply::premultiply::DESC"
media = "video"

[[component]]
kind = "filter"
name = "unpremultiply"
long_name = "UnPreMultiply first stream with first plane of second stream"
ctor = "vaco_filter_key::premultiply::unpremultiply::DESC"
media = "video"

[[component]]
kind = "filter"
name = "maskedmerge"
long_name = "Merge first stream with second stream using third stream as mask"
ctor = "vaco_filter_key::maskedmerge::DESC"
media = "video"

[[component]]
kind = "filter"
name = "colorkey"
long_name = "Turns a certain color into transparency. Operates on RGB colors"
ctor = "vaco_filter_key::colorkey::DESC"
media = "video"

[[component]]
kind = "filter"
name = "colorhold"
long_name = "Turns a certain color range into gray. Operates on RGB colors"
ctor = "vaco_filter_key::colorhold::DESC"
media = "video"

[[component]]
kind = "filter"
name = "maskedclamp"
long_name = "Clamp first stream with second stream and third stream"
ctor = "vaco_filter_key::maskedclamp::DESC"
media = "video"

[[component]]
kind = "filter"
name = "maskedmax"
long_name = "Apply filtering with maximum difference of two streams"
ctor = "vaco_filter_key::masked_pick::maskedmax::DESC"
media = "video"

[[component]]
kind = "filter"
name = "maskedmin"
long_name = "Apply filtering with minimum difference of two streams"
ctor = "vaco_filter_key::masked_pick::maskedmin::DESC"
media = "video"

[[component]]
kind = "filter"
name = "maskedthreshold"
long_name = "Pick pixels comparing absolute difference of two streams with threshold"
ctor = "vaco_filter_key::maskedthreshold::DESC"
media = "video"

[[component]]
kind = "filter"
name = "threshold"
long_name = "Threshold first video stream using other video streams"
ctor = "vaco_filter_key::threshold::DESC"
media = "video"
