# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# T1/T2 temporal and interleave filters, FT-4.12b (GitHub #475): framestep,
# tpad, tmix, tblend, tmedian, tlut2, tmidequalizer, decimate, mpdecimate,
# deflicker, lagfun, freezedetect, freezeframes, dejudder, fsync, random.
# `fps` — the seventeenth name in plan 16 §4.3's row — is *not* registered
# here: it is already registered by `vaco-filter-video-format::fps`, and
# registering it a second time would collide in `cargo xtask dup-check`.
# See `vaco_filter_temporal`'s crate-root doc for the full accounting.
#
# Each `ctor` names the per-filter `pub const DESC: FilterDesc`; runtime
# instantiation goes through `vaco_filter_temporal::registry::TemporalRegistry`,
# a `vaco_filter_graph::registry::FilterRegistry` impl — the same shape
# `vaco-filter-denoise` and `vaco-filter-audio-eq` use.

[[component]]
kind = "filter"
name = "decimate"
long_name = "Decimate frames (post field matching filter)."
ctor = "vaco_filter_temporal::decimate::DESC"
media = "video"

