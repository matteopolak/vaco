# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# One decoder: EN 300 706 Teletext (DVB `dvb_teletext`). Reachable from a
# `vaco-subtitle-bitmap::dvbtxt` demuxer packet (or the equivalent PES
# elementary-stream bytes) through `vaco-registry`'s normal decoder lookup.
#
# Named `dvb_teletext`, matching `CodecId::DvbTeletext::name()` — a prior
# pass named this `teletext`, unable to measure the reference's literal
# decoder-implementation name (behind `--enable-libzvbi`, absent from this
# project's build environment). `ffmpeg -h decoder=dvb_teletext` confirms
# `dvb_teletext` is known to FFmpeg's own codec table even without the
# feature built — the same codec-name-resolves-a-decoder mechanism
# `-c:v vp8` uses to reach `libvpx` — while `teletext` and the previously
# guessed `libzvbi_teletextdec` are both unrecognised. See `src/registry.rs`
# for the full measurement.

[[component]]
kind      = "decoder"
name      = "dvb_teletext"
long_name = "Teletext (EN 300 706)"
feature   = "codec-subtitle-teletext"
ctor      = "vaco_codec_subtitle_teletext::TELETEXT_DECODER"
media     = "subtitle"
codec     = "dvb_teletext"
