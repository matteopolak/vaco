# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Theora decode is unconditionally GREEN: it was designed from the ground up
# as a royalty-free format (derived from the donated, patent-unencumbered
# VP3), and is not listed as encumbered anywhere in
# `planning/research/07-legal-patents-licensing.md` — so this ships like any
# other GREEN codec, with no `encumbered` feature and `default` left at its
# normal `true`.
#
# Decode only, and keyframes only within that (issue #371 asks for decode).
# `CodecId::Theora` already existed in `vaco-codec-core` before this crate
# did.

[[component]]
kind      = "decoder"
name      = "theora"
long_name = "Theora"
feature   = "codec-theora"
ctor      = "vaco_codec_theora::DECODER_THEORA"
media     = "video"
codec     = "theora"
