# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# TGA registers as `targa`, matching the reference's own codec name for it,
# even though this crate's own module/functions stay `tga`.

[[component]]
kind      = "decoder"
name      = "bmp"
long_name = "BMP (Windows and OS/2 bitmap)"
feature   = "codec-image-simple"
ctor      = "vaco_codec_image_simple::BMP_DECODER"
media     = "video"
codec     = "bmp"

[[component]]
kind      = "encoder"
name      = "bmp"
long_name = "BMP (Windows and OS/2 bitmap)"
feature   = "codec-image-simple"
ctor      = "vaco_codec_image_simple::BMP_ENCODER"
media     = "video"
codec     = "bmp"

