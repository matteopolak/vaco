[package]
name = "vaco-codec-ac3"
description = "AC-3 decode: sync frame, BSI, exponents, bit allocation, mantissa dequantisation, coupling, rematrixing, IMDCT/windowing. E-AC-3 extensions behind a non-default, patent-unverified feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-bitstream = { path = "../../core/vaco-bitstream" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
vaco-format-ac3 = { path = "../../format/vaco-format-ac3" }
vaco-frame = { path = "../../model/vaco-frame" }
vaco-packet = { path = "../../model/vaco-packet" }
vaco-sampfmt = { path = "../../model/vaco-sampfmt" }
vaco-chlayout = { path = "../../model/vaco-chlayout" }

[dev-dependencies]
proptest.workspace = true

[features]
# E-AC-3 decode's essential-patent expiry rests on a single hedged secondary
# source (D9) — unresolved, not confirmed. Never in `default`; enabling this
# yourself is supported, shipping it in a published binary is not, and
# neither may happen before counsel records written confirmation (issue
# #369's acceptance criterion). Deliberately not spelled
# `patent-encumbered-eac3-decode`: that name asserts a confirmed
# encumbrance, which is not what D9 says — it says unverified, which is a
# different, weaker claim that still earns the same non-default gate.
patent-unverified-eac3-decode = []

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
