# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
# The standardised ADPCM subset (issue #280, C-02): 4 of the 7 codecs named
# in that issue are registered here (8 components: adpcm_ima_wav, adpcm_ima_qt,
# adpcm_ms, adpcm_swf, decoder + encoder each). adpcm_g722, adpcm_g726 and
# adpcm_g726le are deliberately NOT listed: src/lib.rs's crate doc and
# src/g722.rs / src/g726.rs explain why (a structurally different transform
# from the real ITU-T algorithms, not a byte-inexact implementation of it —
# registering it would hand a caller wrong output with no error).

[[component]]
kind      = "decoder"
name      = "adpcm_ima_wav"
long_name = "ADPCM IMA WAV"
feature   = "codec-adpcm"
ctor      = "vaco_codec_adpcm::ADPCM_IMA_WAV_DECODER"
media     = "audio"
codec     = "adpcm_ima_wav"

[[component]]
kind      = "encoder"
name      = "adpcm_ima_wav"
long_name = "ADPCM IMA WAV"
feature   = "codec-adpcm"
ctor      = "vaco_codec_adpcm::ADPCM_IMA_WAV_ENCODER"
media     = "audio"
codec     = "adpcm_ima_wav"

[[component]]
kind      = "decoder"
