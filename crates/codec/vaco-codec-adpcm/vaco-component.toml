name      = "adpcm_ima_wav"
long_name = "ADPCM IMA WAV"
feature   = "codec-adpcm"
ctor      = "vaco_codec_adpcm::ADPCM_IMA_WAV_ENCODER"
media     = "audio"
codec     = "adpcm_ima_wav"

