# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
# The standardised ADPCM subset (issue #280, C-02): adpcm_ima_wav,
# adpcm_ima_qt, adpcm_ms and adpcm_swf have both directions. G.726 and
# G.726le register their unambiguous four-bit / 32 kbit/s decoders only;
# encoding remains a named refusal. G.722 is deliberately absent because its
# current module is not the ITU-T algorithm.

[[component]]
kind      = "decoder"
name      = "g726"
long_name = "G.726 ADPCM 32 kbit/s"
feature   = "codec-adpcm"
ctor      = "vaco_codec_adpcm::ADPCM_G726_DECODER"
media     = "audio"
codec     = "adpcm_g726"

[[component]]
kind      = "decoder"
name      = "g726le"
long_name = "G.726 ADPCM 32 kbit/s little-endian packing"
feature   = "codec-adpcm"
ctor      = "vaco_codec_adpcm::ADPCM_G726LE_DECODER"
media     = "audio"
codec     = "adpcm_g726le"

[[component]]
kind      = "decoder"
name      = "adpcm_ima_wav"
long_name = "ADPCM IMA WAV"
feature   = "codec-adpcm"
ctor      = "vaco_codec_adpcm::ADPCM_IMA_WAV_DECODER"
media     = "audio"
codec     = "adpcm_ima_wav"

[[component]]
