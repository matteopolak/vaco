# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Vorbis I decode is unconditionally GREEN: D3/D4/D9 name Vorbis (alongside
# Opus and FLAC) as the royalty-free default Ogg codec, and its own
# specification exists precisely to establish that patent-free status — so
# this ships like any other GREEN codec, with no `encumbered` feature and
# `default` left at its normal `true`.
#
# Decode only. No Vorbis encoder is in scope for this crate (issue #308).

[[component]]
kind      = "decoder"
name      = "vorbis"
long_name = "Vorbis"
feature   = "codec-vorbis"
ctor      = "vaco_codec_vorbis::DECODER_VORBIS"
media     = "audio"
codec     = "vorbis"
