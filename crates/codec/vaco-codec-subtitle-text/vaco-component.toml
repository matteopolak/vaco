# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# Seven decoders, six codecs: `ssa` and `ass` share this crate's ASS-chunk
# decode (see src/registry.rs's module docs for why `CodecId::Ssa` needs its
# own registration despite that). No encoders — this crate is decode-only,
# same reasoning `vaco-codec-subtitle-bitmap`'s own fragment states for
# itself.

[[component]]
kind      = "decoder"
name      = "subrip"
long_name = "SubRip subtitle"
feature   = "codec-subtitle-text"
ctor      = "vaco_codec_subtitle_text::registry::SUBRIP_DECODER"
media     = "subtitle"
codec     = "subrip"

