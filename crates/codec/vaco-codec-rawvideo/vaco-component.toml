# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
# 9 decoders / 9 encoders, one row per CodecId this family declares (issue
# #281, C-03). `avui`'s pair is registered like every other identity here even
# though both directions currently return `Error::Unsupported` — see the
# crate docs for why that is the honest option rather than a guess.

