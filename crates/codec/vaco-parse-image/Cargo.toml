[package]
name = "vaco-parse-image"
description = "PNG/JPEG/GIF/BMP/TIFF/WebP header parsing (no decode)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-bitstream = { path = "../../core/vaco-bitstream" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-codec-core = { path = "../../signal/vaco-codec-core" }
vaco-pixfmt = { path = "../../model/vaco-pixfmt" }
vaco-packet = { path = "../../model/vaco-packet" }
# The WebP lossy sub-format ("VP8 " chunk) is byte-for-byte the VP8 key-frame
# header `vaco-parse-vpx` already reads (RFC 6386 §9.1) — reused rather than
# re-implemented (D19).
vaco-parse-vpx = { path = "../vaco-parse-vpx" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 4
