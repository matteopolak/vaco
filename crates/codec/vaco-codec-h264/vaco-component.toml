# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# The second `encumbered = true` component in the tree (D4/D4.1), following
# `vaco-codec-aac`'s precedent exactly: H.264 decode is legally RED (the
# MPEG LA / Access Advance AVC pool), the pool charges per decoder/encoder
# unit, and remuxing/parsing (`vaco-parse-h264`) stays default and is
# unaffected. D4.1 requires `default = false` on any `encumbered = true`
# row — `gen-registry` refuses the opposite combination outright — so both
# are set here together, and the feature name matches epic #51's own title:
# `patent-encumbered-h264-decode`.
#
# `H264Decoder::send_packet` decodes real CABAC I/P slices end to end
# (macroblock layer, prediction, transform, motion compensation, luma
# deblocking, chroma) and `receive_frame` returns real `yuv420p` frames —
# see `crate::decoder`'s own module doc for exactly what that covers and
# what it still refuses honestly (CAVLC, B slices, MBAFF, the 8x8
# transform, multi-slice pictures). `default = false` stays exactly as-is
# regardless: this is still `encumbered = true` decoding under D4/D4.1,
# whether or not it produces a single sample.

[[component]]
kind      = "decoder"
name      = "h264"
long_name = "H.264 / AVC / MPEG-4 Part 10"
feature   = "patent-encumbered-h264-decode"
default   = false
encumbered = true
ctor      = "vaco_codec_h264::DECODER_H264"
media     = "video"
codec     = "h264"
