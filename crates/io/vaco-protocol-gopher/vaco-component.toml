# Registry fragment (plan 19 §3.4). Consumed by `cargo xtask gen-registry`.
#
# `default = false`, same reasoning and same measurement as
# `vaco-protocol-http`'s fragment: this crate depends on
# `vaco-protocol-socket` (`socket2`, via `vaco-protocol-tls` and directly),
# which is `NATIVE_ONLY` in `cargo xtask wasm-check`. Without `default =
# false` here, `protocol-gopher` becomes a *default* optional dependency of
# `vaco-registry`, and anything depending on `vaco-registry` with default
# features (`vaco-cli` included) drags `socket2` into its own wasm build and
# fails on the same wall.

[[component]]
kind      = "protocol"
name      = "gopher"
long_name = "Gopher (RFC 1436)"
feature   = "protocol-gopher"
default   = false
ctor      = "vaco_protocol_gopher::GOPHER_PROTOCOL"

[[component]]
kind      = "protocol"
name      = "gophers"
long_name = "Gopher over TLS"
feature   = "protocol-gopher"
default   = false
ctor      = "vaco_protocol_gopher::GOPHERS_PROTOCOL"
