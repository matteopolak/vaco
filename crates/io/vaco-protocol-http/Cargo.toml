[package]
name = "vaco-protocol-http"
description = "HTTP and HTTPS protocols via ureq with rustls and a pure-Rust crypto provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-time = { path = "../../core/vaco-time" }
# `rustls-no-provider` + `rustls-webpki-roots` rather than the `rustls` feature:
# the latter pulls in `ring` (`rustls?/ring`), which D14.2 rejects for vendoring
# and compiling C and assembly (D10 Gate 1). See docs/io/vaco-protocol-http.md
# "Dependencies" for the full gate-by-gate record.
ureq = { workspace = true, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls.workspace = true
rustls-rustcrypto.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 2
