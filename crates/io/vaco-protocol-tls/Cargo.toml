[package]
name = "vaco-protocol-tls"
description = "The tls: protocol, and this workspace's one rustls/rustls-rustcrypto/webpki-roots dependency (D11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-protocol-socket = { path = "../../io/vaco-protocol-socket" }
vaco-time = { path = "../../core/vaco-time" }
# D14.2's provider decision: rustls with a pure-Rust crypto provider. See the
# crate docs for the full D11/D14.2 record (also carried in
# docs/io/vaco-protocol-http.md, which had it first).
rustls.workspace = true
rustls-rustcrypto.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 2
