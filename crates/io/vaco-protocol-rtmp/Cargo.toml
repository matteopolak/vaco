[package]
name = "vaco-protocol-rtmp"
description = "RTMP: chunk stream (handshake, chunking/dechunking, control messages), AMF0, and NetConnection/NetStream command flow (connect/createStream/publish/play). rtmps needs no code here (transport-agnostic framing); rtmpt/ffrtmphttp not built (no citable wire-framing source). The rtmp: Protocol impl lands in a later package."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-limits = { path = "../../core/vaco-limits" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-time = { path = "../../core/vaco-time" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 2
