[package]
name = "vaco-protocol-dtls"
description = "The dtls: protocol, and this workspace's one openssl dependency (D11, D10 Gate 1 amendment)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
vaco-protocol-socket = { path = "../../io/vaco-protocol-socket" }
vaco-time = { path = "../../core/vaco-time" }
# D10 Gate 1 amendment (2026-08-28, owner; planning/00-decisions.md): FFI is
# permitted here because DTLS carries no media semantics, and no pure-Rust
# DTLS implementation exists (the reason #562 was blocked before the
# amendment). `vendored` builds OpenSSL from source via openssl-src, so this
# crate does not depend on a system OpenSSL being present at build time. See
# the crate docs for the full D10/D11 record and docs/dependencies.md for the
# Gate 2/3 assessment (openssl chosen over boring/wolfssl).
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.vaco]
layer = 2
