[package]
name = "vaco-protocol-crypto"
description = "The crypto: protocol: AES-128-CBC over a nested URL, and this workspace's one aes/cbc dependency (D11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-io = { path = "../../io/vaco-io" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
# D10/D11: pure-Rust RustCrypto AES, declared in `[workspace.dependencies]`
# since the workspace's initial commit but unused by any crate until this one.
# See docs/dependencies.md for the adoption record — this crate is the sole
# owner (`cargo xtask owner-gate`). `ctr` (also pre-declared, for a future
# CENC user) is deliberately NOT taken here: measurement against `ffmpeg 8.1`
# (see `docs/io/vaco-protocol-crypto.md`) found the `crypto:` protocol is
# AES-128-**CBC** with PKCS#7 padding, not the CTR the work package's own
# title assumed. `cbc` is taken instead of `ctr`.
aes = { workspace = true }
cbc = { workspace = true, features = ["alloc"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
vaco-protocol-file = { path = "../../io/vaco-protocol-file" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 2
