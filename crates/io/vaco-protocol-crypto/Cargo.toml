[package]
name = "vaco-protocol-crypto"
description = "The crypto: protocol: AES-128-CBC over a nested URL. Sole owner of cbc (D11); aes moved to vaco-crypto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vaco-core = { path = "../../core/vaco-core" }
vaco-crypto = { path = "../../core/vaco-crypto" }
vaco-io = { path = "../../io/vaco-io" }
vaco-opts = { path = "../../core/vaco-opts" }
vaco-protocol-core = { path = "../../io/vaco-protocol-core" }
# D11: `aes` moved to `vaco-crypto` on 2026-08-28 once a second consumer
# (`vaco-protocol-rist`'s PSK/AES-CTR) made the shared home load-bearing
# rather than speculative — this crate now reaches `Aes128` through
# `vaco_crypto::aes` rather than declaring `aes` itself. `cbc` stays a
# direct dependency here: this is still the only crate doing CBC mode
# (measured against `ffmpeg 8.1`, see `docs/io/vaco-protocol-crypto.md` —
# `ctr`, pre-declared for the same future CENC user, was and remains
# untaken by this crate).
cbc = { workspace = true, features = ["alloc"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
vaco-protocol-file = { path = "../../io/vaco-protocol-file" }

[lints]
workspace = true

[package.metadata.vaco]
layer = 2
