name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sccache: the wrapper is configured in .cargo/config.toml, so every job needs
  # the binary present or every build fails.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Fast gates first: they are cheap and catch most mistakes, and PR feedback has
  # a 15-minute budget (plan 13 §5).
  policy:
    name: policy gates
    runs-on: ubuntu-latest
    steps:
      # provenance-check walks the commit range since provenance/baseline, so
      # the default single-commit fetch is not enough.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo fmt --all -- --check
      # D10 Gate 1 — checked against the resolved BUILD GRAPH, not Cargo.lock,
      # which lists optional deps whether or not they are enabled (plan 19 §11).
      - run: cargo xtask dep-gate
      # D2/D13 — `unsafe` only in vaco-hw-*, and no crate silently stops
      # inheriting forbid(unsafe_code).
      - run: cargo xtask unsafe-audit
      # D18: every library still builds for wasm32.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo xtask wasm-check
      # D18, the other half: `std::time::Instant::now()` *compiles* for wasm32
      # and panics when called, so `wasm-check` alone cannot see it.
      - run: cargo xtask time-gate
      # D4: no patent-encumbered component in the published build. Asserts on
      # the compiled feature list, not on what a manifest claims.
      - run: cargo xtask patent-gate
      # D11: each third-party media crate is reachable from exactly one Vaco
      # crate, so swapping a backend rewrites one crate and nothing else.
      - run: cargo xtask owner-gate
      # D19: one definition per concept.
      - run: cargo xtask dup-check
      # A component that exists, compiles, passes its own tests, and cannot
      # be reached from the CLI — the H.264/vaco-codec-opus/FLAC-as-CDG shape
      # of bug, swept mechanically instead of found by accident.
      - run: cargo xtask reachability-check
      # The crate graph stays acyclic and downward (D14.1).
      - run: cargo xtask layer-check
      # D15: every large constant table names the document or measurement it
      # came from, and every commit touching implementation code carries its
      # provenance trailers. Needs full history for the trailer half.
      - run: cargo xtask provenance-check
      # Comments stay short and local (no citing a planning doc that gets
      # renumbered, no citing an issue number instead of saying what the code
      # does, no 40+ line run). A ratchet against xtask/src/comment_check.rs's
      # own BASELINE, not a hard zero — this gate found a 1200+ backlog the
      # moment it was first run, precisely because it was wired into neither
      # this workflow nor `just ci` until now, so nothing had ever run it.
      - run: cargo xtask comment-check
      # Generated files are current.
      - run: cargo xtask gen-registry --check
      - run: cargo xtask gen-docs-index --check
      - run: cargo xtask gen-pixfmt --check
      - run: cargo xtask gen-fuzz --check
      - run: cargo xtask gen-coverage --check
      # REPORTS, not gates — always exit 0 (see each xtask module's own doc),
      # so they cannot fail this job, but they were never even being run
      # anywhere, which is the same failure to look at milder wallpaper.
      - run: cargo xtask dead-code
      - run: cargo xtask option-consumption-check
      - run: cargo xtask vlc-scan
      # `fuzz/` is its own workspace (F1-F9), so it is built by neither
      # `check-all` nor the clippy job below — a target can rot against a
      # correct API change and nothing else here would notice. Install
      # nightly + cargo-fuzz so this leg actually gates rather than skipping;
      # `xtask fuzz-check` degrades to a clear skip on a machine that lacks
      # either, which is what running `just ci` locally without them does.
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - run: cargo xtask fuzz-check

  licence:
    name: licence and advisories
    runs-on: ubuntu-latest
    # These are container actions we do not control, so sccache cannot be
    # installed inside them — and .cargo/config.toml sets it as the rustc
    # wrapper for every invocation in this repo. An empty RUSTC_WRAPPER
    # overrides the config and disables it. Neither action compiles anything,
    # so there is nothing to cache here anyway.
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      # D9: cargo-deny alone is NOT sufficient for LICENCES — crates.io metadata
      # lies (the x264 and x265 crates declare MIT while linking GPL), so
      # `dep-gate` in the policy job is the structural defence there.
      #
      # `advisories` is checked here rather than by `rustsec/audit-check`, which
      # reads its ignore list from `.cargo/audit.toml` and so could not see
      # deny.toml's. Keeping both meant two ignore lists that had to agree, and
      # they did not: audit-check ran with an empty list and failed this job on
      # `paste` from the day it was added. One tool, one list.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses bans sources advisories }

  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sccache_version: v0.17.0
          - os: macos-latest
            sccache_version: v0.17.0
          - os: windows-latest
            # sccache v0.17.0 expands Rust argfiles before spawning rustc;
            # on Windows this can exceed CreateProcess's command-line limit
            # (mozilla/sccache#2787). v0.16.0 preserves the argfile.
            sccache_version: v0.16.0
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: ${{ matrix.sccache_version }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  features:
    name: feature-gate consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      # A crate that only compiles when some unrelated feature happens to be on
      # is a latent breakage; both extremes must build.
      - run: cargo check --workspace --no-default-features --locked
      - run: cargo check --workspace --all-features --locked

  binary-size:
    name: binary-size dispatch budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      # D12's multiversioning cost is allowed to be at most 2.5x the build
      # that keeps only the x86-64 baseline dispatch arm. The two isolated
      # target directories ensure Cargo never reuses a differently-configured
      # fearless_simd artifact for the comparison.
      - name: Keep multiversioning within the release size budget
        shell: bash
        run: |
          cargo build --release --locked -p vaco --bin vvmpeg --target-dir target/size-full
          RUSTFLAGS="--cfg disable_dispatch_avx512 --cfg disable_dispatch_avx2 --cfg disable_dispatch_sse4_2" \
            cargo build --release --locked -p vaco --bin vvmpeg --target-dir target/size-baseline
          full=$(stat --format=%s target/size-full/release/vvmpeg)
          baseline=$(stat --format=%s target/size-baseline/release/vvmpeg)
          echo "vvmpeg dispatch build: ${full} bytes; baseline-dispatch build: ${baseline} bytes"
          test "$baseline" -gt 0
          test $(( full * 2 )) -le $(( baseline * 5 ))

  # QA-05/QA-07 (plan 13 §5.2's `fuzz-regressions` job): every seed under
  # fuzz/seeds/ once crashed something and was fixed; replaying all of them
  # on every PR is what keeps a fix a fix. `scripts/replay-fuzz-regressions.sh`
  # is `cargo +nightly fuzz run <target> <seed>` looped over every seed —
  # fuzz/seeds/README.md's own documented replay command, just run for you.
  fuzz-regressions:
    name: fuzz regression replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - run: ./scripts/replay-fuzz-regressions.sh

  # QA-07 (plan 13 §5.2's `conformance-smoke`/`conformance-mapped`), scaled
  # back to what this project can actually run today. Two honest gaps against
  # the plan, both worth fixing in a follow-up rather than silently:
  #   1. Plan 13 §1.6 pins an exact reference build via a container digest
  #      (`ghcr.io/vaco/refbin@sha256:...`); no such image exists yet, so this
  #      uses distro ffmpeg instead — a real but unpinned reference.
  #   2. `--tier smoke` (the plan's ~400-case, 4-minute budget) currently
  #      selects zero cases: nothing in tests/conformance/ is tagged `smoke`
  #      yet, only `core`/`full`. Using `--tier core` here instead (706 cases,
  #      several minutes) until that tagging pass happens.
  # `continue-on-error: true` is deliberate and temporary: per
  # planning/AGENT-CONSTRAINTS.md's "byte-exactness is a check, not the bar"
  # ruling, a real divergence is not automatically a failure, and this
  # project's divergence-allowlist/deviation-shape machinery (see
  # vaco-conformance::deviation) is not yet wired through every comparator —
  # today's `core` tier run reports several hundred divergences that are
  # mostly known, unreviewed gaps rather than regressions. This job is
  # advisory (visible in every PR, blocking none) until that backlog is
  # triaged; flip `continue-on-error` off once it is.
  conformance:
    name: conformance (core tier, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo run -p vaco-conformance --locked -- run --tier core
