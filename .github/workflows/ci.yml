name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sccache: the wrapper is configured in .cargo/config.toml, so every job needs
  # the binary present or every build fails.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Fast gates first: they are cheap and catch most mistakes, and PR feedback has
  # a 15-minute budget (plan 13 §5).
  policy:
    name: policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo fmt --all -- --check
      # D10 Gate 1 — checked against the resolved BUILD GRAPH, not Cargo.lock,
      # which lists optional deps whether or not they are enabled (plan 19 §11).
      - run: cargo xtask dep-gate
      # D2/D13 — `unsafe` only in vaco-hw-*, and no crate silently stops
      # inheriting forbid(unsafe_code).
      - run: cargo xtask unsafe-audit
      # D18: every library still builds for wasm32.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo xtask wasm-check
      # D18, the other half: `std::time::Instant::now()` *compiles* for wasm32
      # and panics when called, so `wasm-check` alone cannot see it.
      - run: cargo xtask time-gate
      # D4: no patent-encumbered component in the published build. Asserts on
      # the compiled feature list, not on what a manifest claims.
      - run: cargo xtask patent-gate
      # D11: each third-party media crate is reachable from exactly one Vaco
      # crate, so swapping a backend rewrites one crate and nothing else.
      - run: cargo xtask owner-gate
      # D19: one definition per concept.
      - run: cargo xtask dup-check
      # The crate graph stays acyclic and downward (D14.1).
      - run: cargo xtask layer-check
      # Generated files are current.
      - run: cargo xtask gen-registry --check
      - run: cargo xtask gen-docs-index --check
      - run: cargo xtask gen-pixfmt --check
      - run: cargo xtask gen-fuzz --check

  licence:
    name: licence and advisories
    runs-on: ubuntu-latest
    # These are container actions we do not control, so sccache cannot be
    # installed inside them — and .cargo/config.toml sets it as the rustc
    # wrapper for every invocation in this repo. An empty RUSTC_WRAPPER
    # overrides the config and disables it. Neither action compiles anything,
    # so there is nothing to cache here anyway.
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses bans sources }
      # D9: cargo-deny alone is NOT sufficient — crates.io metadata lies (the
      # x264 and x265 crates declare MIT while linking GPL). The dep-gate job
      # above is the structural defence; this catches the rest.
      - uses: rustsec/audit-check@v2
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }

  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  features:
    name: feature-gate consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      # A crate that only compiles when some unrelated feature happens to be on
      # is a latent breakage; both extremes must build.
      - run: cargo check --workspace --no-default-features --locked
      - run: cargo check --workspace --all-features --locked
