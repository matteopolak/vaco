# Vaco — a clean-room Rust reimplementation of ffmpeg / ffprobe / ffplay.
#
# See planning/00-decisions.md for the binding constraints (D1-D15) and
# planning/10-architecture.md for the crate layering this manifest realises.

[workspace]
resolver = "3"
# GLOB MEMBERSHIP IS LOAD-BEARING (plan 19 §3.1).
#
# Work is done by many agents in ONE shared working tree on ONE branch. The root
# manifest is the single file every new crate would otherwise have to touch, which
# would make it the project's biggest contention point. With a glob, adding a crate
# is creating a directory — no agent ever edits this file to register one.
#
# The layer directories under crates/ mirror planning/10-architecture.md §3.
members = ["crates/*/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/matteopolak/vaco"
authors      = ["Vaco contributors"]

# Inherited by every crate via `[lints] workspace = true`.
#
# `unsafe_code = "forbid"` is the project's central safety guarantee (D2). It is a
# per-crate lint, so crates that genuinely need unsafe — only the `vaco-hw-*`
# family, per D13 — simply do not inherit this block and declare their own
# `[lints]` instead. That makes the exception set explicit and auditable rather
# than hidden behind an `#[allow]` somewhere in a file.
[workspace.lints.rust]
unsafe_code            = "forbid"
missing_debug_implementations = "warn"
unreachable_pub        = "warn"
rust_2018_idioms       = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic         = { level = "warn", priority = -1 }
# Denied because each is a latent panic, and a panic reachable from untrusted
# input is a decoder vulnerability (plan 13 §2).
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
indexing_slicing = "deny"
integer_division = "deny"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
# Noise in a codebase full of format enums and bit manipulation.
module_name_repetitions = "allow"
similar_names           = "allow"
# Format and algorithm names read as identifiers to this lint: "PHM (Portable
# HalfMap)", "PAM (Portable AnyMap)", CRC and codec names. Backticking them
# would be wrong -- they are prose, not code. Three crates already carried a
# file-level allow with that same reason; this makes it the workspace rule
# instead of something each new image or codec crate rediscovers.
doc_markdown            = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
cast_precision_loss      = "allow"
too_many_lines           = "allow"
# `chunks_exact` on a literal size is flagged in favour of `as_chunks`. Measured
# on the real FFT/RDFT path and found to be **parity**, not a win: one O(n) pass
# inside an O(n log n) transform dominated by twiddle work. The lint fires in
# dozens of codec/format/filter crates, so denying it would force a large
# mechanical churn across files several agents are editing, for no measured
# benefit, and it currently blocks the whole workspace gate. Converting a
# specific hot site to `as_chunks` is still encouraged where a profile justifies
# it -- `&[[T; N]]` does remove bounds checks -- but it must be measured, not
# applied wholesale.
chunks_exact_to_as_chunks = "allow"
# The remaining lints below are new in `nightly-2026-08-07` (D22) and appeared
# only because the toolchain moved. None is a regression: the code they flag was
# accepted by stable 1.97.1 the day before. They are allowed here so the bump
# does not fail every agent's `-D warnings` gate at once -- the alternative was
# a mechanical sweep across codec/format/filter files that several agents were
# editing concurrently, which is how three cross-agent collisions happened this
# session.
#
# `manual_midpoint` and `manual_slice_fill` are worth adopting where they land
# on a hot path -- `midpoint` is overflow-safe (it fixed a real panic in
# vaco-codec-h264's CAVLC level decode) and `fill` beats a hand loop -- so
# convert them opportunistically when you are already editing the file, and
# remove the corresponding `allow` once a crate is clear. Do not open a
# tree-wide sweep for them.
manual_midpoint          = "allow"
manual_slice_fill        = "allow"
needless_range_loop      = "allow"
needless_late_init       = "allow"
match_same_arms          = "allow"
many_single_char_names   = "allow"

# PRE-POPULATED SO AGENTS NEVER EDIT THIS FILE (plan 19 §3.2).
#
# Every dependency the plans anticipate is declared here once. Crates then write
# `foo.workspace = true` and nothing else. An agent that needs something not listed
# here STOPS and requests it rather than editing the root — deliberate friction,
# since D10 makes every adoption a reviewed decision anyway.
#
# D10 gates: pure Rust with zero FFI, permissive licence, trusted and maintained.
[workspace.dependencies]
# --- SIMD substrate (D12). Reachable ONLY from vaco-simd, per the D11 adapter rule.
fearless_simd = "0.7"

# --- error handling, logging, small utilities
thiserror  = "2"
tracing    = "0.1"
bitflags   = "2"
smallvec   = "1"
arrayvec   = "0.7"
bytemuck   = "1"
memchr     = "2"

# --- concurrency
rayon      = "1"
crossbeam-channel = "0.5"
crossbeam-utils   = "0.8"
parking_lot = "0.12"

# --- general-purpose compression (general algorithms, not media codecs)
miniz_oxide = "0.8"
lzma-rs     = "0.3"

# --- crypto and hashing (CENC, HLS AES-128, checksums) — RustCrypto, pure Rust
aes    = "0.9"
cbc    = "0.2"
ctr    = "0.10"
hmac   = "0.12"
pbkdf2 = "0.12"
sha1   = "0.10"
sha2   = "0.10"
md-5   = "0.10"
crc    = "3"
crypto-bigint = { version = "0.7.5", default-features = false, features = ["subtle", "zeroize"] }

# --- networking and TLS. D14.2 originally required a PURE-RUST provider (both
#     `ring` and `aws-lc-rs` compile C and assembly, which failed D10 Gate 1 at
#     the time). The 2026-08-28 owner amendment to Gate 1 (planning/00-decisions.md,
#     "Gate 1 amendment") permits FFI for TLS specifically, because it carries no
#     media semantics. `rustls-rustcrypto` (D14.2's pure-Rust choice) turned out
#     to be pinned at 0.0.2-alpha with no release since 2024-04-24 and seven
#     RUSTSEC advisories that could never clear without a new release — it failed
#     Gate 3 outright. `ring` replaces it: actively developed (see
#     docs/dependencies.md), Apache-2.0 AND ISC (both allowed), and its only
#     extra build machinery is `cc` (compiling its own C/assembly), versus
#     `aws-lc-rs`'s heavier cc+cmake+pkg-config+bindgen footprint for the same
#     job — see docs/dependencies.md for the full comparison.
rustls       = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
ureq              = { version = "3", default-features = false }
socket2           = "0.5"
quick-xml         = "0.42"

# --- text shaping and fonts (general typography, not a media codec)
cosmic-text = "0.12"
swash       = "0.2"
ttf-parser  = "0.25"

# --- presentation (vaco-play). Not media codecs.
wgpu       = "23"
winit      = "0.30"
cpal       = "0.15"
pollster   = "0.4"

# --- proc-macro tooling (vaco-opts derive)
syn        = { version = "2", features = ["full", "extra-traits"] }
quote      = "1"
proc-macro2 = "1"

# --- image codec backends (D11): each reachable from exactly one
#     vaco-codec-* crate, enforced by `cargo xtask owner-gate`.
png         = "0.18"
gif         = "0.14"
tiff        = "0.11"
exr         = "1.74"
jxl-oxide   = "0.12"
image-webp  = "0.2"

# --- dev-dependencies
#
# rustfft is a DEV-dependency only: a float FFT oracle for vaco-tx above n~1024,
# where the O(n^2) f64 definitions in its own reference module become too slow to
# run. Below that the direct definitions are the stronger oracle, being the
# definition rather than another implementation.
#
# D10 assessment (adopted 2026-08-22): pure Rust with zero FFI (gate 1);
# MIT OR Apache-2.0 (gate 2); widely used, actively maintained, shallow tree
# (gate 3). It uses `unsafe` internally for SIMD, which D10 says to weigh rather
# than veto — and here it is moot, because a dev-dependency never enters a
# shipped artifact. Plan 17 rejected it as an IMPLEMENTATION on model fit (we
# need bit-exact i32 fixed point, which it does not provide); as an oracle that
# objection does not apply.
rustfft    = "6"
proptest   = "1"
divan      = "0.1"
insta      = "1"
tempfile   = "3"

# Release: LTO and one codegen unit are the baseline for a performance-critical
# binary. PGO is layered on top by `just build-pgo` (plan 12 §7) rather than being
# configured here, since it needs a profile-generate/profile-use two-pass build.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

# `dist` is what we actually publish: release plus the debug info needed to
# symbolise a crash report from a user.
[profile.dist]
inherits = "release"
strip    = "none"
debug    = "line-tables-only"

# Benchmarks must be measured with release codegen but keep symbols so profiles
# are readable.
[profile.bench]
inherits = "release"
strip    = "none"
debug    = "line-tables-only"

# Dependencies are compiled optimised even in dev builds: a debug-profile decoder
# is too slow to run conformance suites against, and dependency code is not what
# anyone is stepping through.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug     = true
